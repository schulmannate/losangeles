            { "id": "beverly-glen", "name": "Beverly Glen", "region": "Westside", "description": "", "subAreas": `<ul><li><b>Glen Market</b><br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1603+N+Beverly+Glen+Blvd,+Los+Angeles,+CA+90077" target="_blank" rel="noopener noreferrer">1603 N Beverly Glen Blvd, Los Angeles, CA 90077</a></span></li></ul>` },
            { "id": "beverly-grove", "name": "Beverly Grove", "region": "Central L.A.", "description": "", "subAreas": `<ul><li><b>Original Farmers Market Market</b><br>The Original Farmers Market (6333 W 3rd St) opened July 1934 on retired dairy land owned by A.F. Gilmore. Permanent stalls replaced farmers' trucks within months; today the site hosts over 100 vendors and is a Los Angeles Historic-Cultural Monument (HCM 543).<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=6333+W+3rd+St,+LA,+CA+90036" target="_blank" rel="noopener noreferrer">6333 W 3rd St, LA, CA 90036</a></span></li><li><b>The Grove</b><br>Adjacent to the market, The Grove (189 The Grove Dr) emerged in the early 2000s as a 575,000 sq ft open-air retail and entertainment complex. Developer Rick Caruso opened it in 2002, introducing an electric streetcar link to the market and spurring additional tourism and dining traffic.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=189+The+Grove+Dr,+LA,+CA+90036" target="_blank" rel="noopener noreferrer">189 The Grove Dr, LA, CA 90036</a></span></li></ul>` },
            { "id": "beverly-hills", "name": "Beverly Hills", "region": "Westside", "description": "", "subAreas": `<ul><li><b>America's Most Famous Zipcode 90210</b></li><li><b>Beverly Hills Hotel Historic Hotel</b><br>including the Polo Lounge  The Beverly Hills Hotel (9641 W Sunset Blvd) opened May 12 1912, two years before the city's incorporation, on land once part of Rancho Rodeo de las Aguas. Designed by Elmer Grey in Mission Revival style, it was nicknamed the "Pink Palace" in 1948. Its Polo Lounge was christened by owner Hernando Courtright in 1941 for his polo-playing friends<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=9641+W+Sunset+Blvd,+Beverly+Hills,+CA+90210" target="_blank" rel="noopener noreferrer">9641 W Sunset Blvd, Beverly Hills, CA 90210</a></span></li><li><b>Celebrity Medical & Office Hub</b><br>Located in the "Golden Triangle," this building is known for housing high-profile medical and talent offices.- <b>Classic Beverly Grove Apartments</b><br>This is a 1936 multi-unit apartment building located just outside the Beverly Hills city limits.- <b>Falcon's Lair</b><br>The legendary hillside estate of silent film idol Rudolph Valentino. Named after his unproduced film The Hooded Falcon, this Spanish colonial aerie is steeped in Hollywood tragedy, rumors of hauntings, and the eccentric legacy of heiress Doris Duke, who later walled herself inside. Haunted, Glamorous, Secluded, Tragic.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1436+Bella+Drive,+Beverly+Hills,+CA+90210" target="_blank" rel="noopener noreferrer">1436 Bella Drive, Beverly Hills, CA 90210</a></span></li><li><b>Franklin Canyon Park</b><br>This is a public park and nature preserve, but it is most famous as a legendary filming location.- <b>Groucho Marx’s Final Home</b><br>This single-story Trousdale Estates home was the last residence of the legendary comedian Groucho Marx.- <b>Modern Luxury in the "Deep Canyon"</b><br>Located in the Beverly Post Office (BHPO) area, this address is a prominent example of high-end contemporary redevelopment in a neighborhood known for celebrity privacy.- <b>North Arnaz Drive Historic District</b></li><li><b>North Arnaz Drive Historic District</b><br>A rare, preserved pocket of "garden apartments" built in 1928. Unlike the walled-off estates nearby, this district showcases a human-scale, walkable vision of luxury, where fountains and courtyards replace gates. A time capsule of the city's sophisticated multi-family past.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=300+N+Arnaz+Dr,+Beverly+Hills,+CA+90211" target="_blank" rel="noopener noreferrer">300 N Arnaz Dr, Beverly Hills, CA 90211</a></span></li><li><b>The Flats</b><br>The Flats is the original, level residential section north of Santa Monica Boulevard. Launched October 21 1906 as "Between the City and the Sea," The Flats featured larger lots with Spanish, Traditional, and Ranch-Style homes. Modern revival and celebrity-owned estates continue this pattern of elite, architect-driven design. The original "garden city" vision of Beverly Hills. Here, the manicured lawns are wide, the streets are lined with massive palm and jacaranda trees, and the architecture shifts from Spanish Colonial to storybook Tudor. It’s the "approachable" face of extreme wealth—perfectly flat and eerily quiet.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1000+N+Roxbury+Dr,+Beverly+Hills,+CA+90210" target="_blank" rel="noopener noreferrer">1000 N Roxbury Dr, Beverly Hills, CA 90210</a></span></li><li><b>The Golden Triangle</b><br>The commercial heart of the 90210. Bounded by Wilshire, Santa Monica, and Cañon, this wedge of real estate concentrates the world’s highest luxury brands into a walkable, open-air runway. It smells of expensive perfume and tourists hoping to spot a celebrity.- <b>The Samuel Goldwyn Estate <br>(owned by Taylor Swift)</b><br>A historic landmark built in 1934 for movie mogul Samuel Goldwyn.- <b>The Sol Wurtzel Estate</b><br>This is a historic property designed in 1932 by the legendary architect Wallace Neff (who created the "California style"). Importance: It was built for Sol M. Wurtzel, a powerful classic Hollywood producer (Fox Film Corporation). The home is famous for its distinctive semicircular design that follows the contour of the land overlooking the Bel-Air Country Club. It is often cited as one of Neff’s grandest Mediterranean-style villas.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=10452+Bellagio+Road,+Beverly+Hills,+CA+90210" target="_blank" rel="noopener noreferrer">10452 Bellagio Road, Beverly Hills, CA 90210</a></span></li><li><b>Trousdale Estates</b><br>Trousdale Estates, annexed to Beverly Hills in 1954 by developer Paul Trousdale, transformed the former Doheny Ranch foothills into 532 lots for celebrity architects. A living museum of architecture by legends like Wallace Neff and Paul R. Williams. Strict view-protection and architectural covenants preserve this hillside enclave of Mid-Century Modern masterpieces. The mid-century modern "Acropolis" of Los Angeles. Carved out of the Doheny Ranch in the 1950s, this enclave enforced strict rules: single-story homes only, flat roofs, and zero obstruction of the view.</li></ul>` },
            { "id": "beverly-park", "name": "Beverly Park", "region": "", "description": "", "subAreas": `<ul><li>Beverly Park is split into two: North Beverly Park* (North Beverly Park Homeowners Association) and South Beverly Park (South Beverly Park Homeowners Association)- <br>- Gates and access: The main North Beverly Park entrance is at 13100 Mulholland Drive, Beverly Hills, CA 90210. Size: 250 acres.- <br>- Location and size: Beverly Park is a guard-gated community completed as a 250-acre enclave. Beverly Park uses the Beverly Hills Post Office address within ZIP code 90210, though it is technically in the city of Los Angeles. Minimum house size: Property covenants require homes to be at least 5,000 square feet.- <br>- Income status: It is cited as Los Angeles's highest-earning neighborhood, with a mean household income of about $502,440 Renowned for celebrity ownership, it is cited as LA's highest-earning neighborhood with a mean household income over $500,000 (about $502,440). Starting in 1979, developers Brian Adler and Elliot Gottfurcht joined forces to turn Beverly Park into "an idyllic community of historic-feeling grand estates that would feel like Beverly Hills of yesteryear." From actors and musicians to sports legends, media moguls, and record-breaking sale prices, Los Angeles' Beverly Park has it all.- <br>- Famous residents of Beverly Park, past and present, include: Adele (Adele bought Sylvester Stallone's former North Beverly Park estate for about $58 million in early 2022; currently a resident. The Richard Landry–designed compound spans roughly 21,000 square feet on 3.5 acres) Barry Bonds (former resident) Denzel Washington Eddie Murphy Faith Hill & Tim McGraw (former resident: Faith Hill & Tim McGraw are former residents of Beverly Park South. They sold their Beverly Park mansion in 2009 for $9.5 million) Justin Bieber & Hailey Bieber (purchased a Beverly Park estate for $25.8 million in August 2020; currently primary residence. The 2.5-acre property includes a nearly 11,000-square-foot home with a tennis court and pool) Mark Wahlberg (former resident; Mark Wahlberg's Former L.A. Mansion Is Back on the Market for $21.8 Million, Owned by the rapper-turned-actor from 2001 to 2013 Paris Hilton (current resident: "Paris Hilton Just Snagged Mark Wahlberg's Former L.A. Megamansion for $63 Million, The sprawling Richard Landry-designed estate in the 90210's desirable Beverly Park neighborhood comes complete with its own golf course and skate park." Source: https://robbreport.com/shelter/celebrity-homes/paris-hilton-mansion-beverly-hills-1236838907/) Rod Stewart Samuel L. Jackson Sofia Vergara Sylvester Stallone (former resident, sold his house to Adele) Westside</li></ul>` },
            { "id": "beverlywood", "name": "Beverlywood", "region": "Westside", "description": "", "subAreas": `<ul><li><b>The Beverlywood Bakery</b><br>The House of Quality Since 1946<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=9128+West+Pico+Boulevard+Los+Angeles,+CA+90035-1321" target="_blank" rel="noopener noreferrer">9128 West Pico Boulevard Los Angeles, CA 90035-1321</a></span></li></ul>` },

housing project (former Aliso Village)</b></li><li><b>Ramona Gardens</b></li><li><b>Robert Vargas Square</b><br>located at First St. & State St.- <b>Russian Flats (Historic)</b></li></ul>` },
            { "id": "bradbury", "name": "Bradbury", "region": "San Gabriel Valley", "description": "", "subAreas": `<ul><li><b>Wilbur C. Pearce House</b><br>Designed by Frank Lloyd Wright<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=2+Bradbury+Hills+Rd,+Bradbury,+CA+91008" target="_blank" rel="noopener noreferrer">2 Bradbury Hills Rd, Bradbury, CA 91008</a></span></li></ul>` },
            { "id": "brentwood", "name": "Brentwood", "region": "Westside", "description": "", "subAreas": `<ul><li><b>Brentwood Circle</b></li><li><b>Brentwood Glen</b></li><li><b>Brentwood Heights</b></li><li><b>Brentwood Park</b></li><li><b>Brentwood Village</b></li><li><b>Crestwood Hills</b></li><li><b>Kenter Canyon</b></li><li><b>Mandeville Canyon</b></li><li><b>Murphy Ranch</b></li><li><b>Sullivan Canyon</b></li><li><b>Westgate Heights</b></li><li>The Getty Center<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1200+Getty+Center+Dr,+Los+Angeles,+CA+90049" target="_blank" rel="noopener noreferrer">1200 Getty Center Dr, Los Angeles, CA 90049</a></span></li><li><b>Fresh Prince of Bel-Air Exterior</b><br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=251+N.+Bristol+Ave,+Los+Angeles:Brentwood,+CA+90049" target="_blank" rel="noopener noreferrer">251 N. Bristol Ave, Los Angeles:Brentwood, CA 90049</a></span></li><li><b>Frank Gehry designed Schnabel House</b><br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=526+N+Carmelina+Ave,+Los+Angeles,+CA+90049" target="_blank" rel="noopener noreferrer">526 N Carmelina Ave, Los Angeles, CA 90049</a></span></li></ul>` },
            { "id": "broadway-manchester", "name": "Broadway-Manchester", "region": "South L.A.", "description": "", "subAreas": `<ul><li><b>Site of the Manchester Theatre (Demolished)</b><br>Opened in 1926, this was a massive "movie palace" with an exotic Egyptian/East Indian interior design, serving as a major entertainment hub for the area long before the multiplex era. It was a cultural anchor for decades before falling into disrepair.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=322+W.+Manchester+Ave+Los+Angeles,+CA+90003" target="_blank" rel="noopener noreferrer">322 W. Manchester Ave Los Angeles, CA 90003</a></span></li><li><b>Samuel Gompers Middle School</b><br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=234+E+112th+St,+Los+Angeles,+CA+90061" target="_blank" rel="noopener noreferrer">234 E 112th St, Los Angeles, CA 90061</a></span></li></ul>` },
            { "id": "burbank", "name": "Burbank", "region": "San Fernando Valley", "description": "", "subAreas": `<ul><li>Walt Disney Studios<br>Disney's 51-acre Streamline Moderne lot at 500 S Buena Vista opened February 23, 1940.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=500+S+Buena+Vista+St,+Burbank,+CA" target="_blank" rel="noopener noreferrer">500 S Buena Vista St, Burbank, CA 91521</a></span></li><li>Warner Bros. Studio<br>First National Pictures built the 62-acre lot in 1926; Warner Bros. acquired control in 1928.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=3400+Warner+Blvd,+Burbank,+CA" target="_blank" rel="noopener noreferrer">3400 Warner Blvd, Burbank, CA 91505</a></span></li><li>Bomp Records<br>Oldest independent label in the US.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=919+Isabel+Street,+Burbank+91506" target="_blank" rel="noopener noreferrer">919 Isabel Street, Burbank 91506</a></span></li><li>B & B Auto Body Works<br>Awesome art-deco lettering.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1017+West+Magnolia+Boulevard+Burbank,+CA" target="_blank" rel="noopener noreferrer">1017 West Magnolia Boulevard Burbank, CA 91506</a></span></li><li>Safari Inn<br>Old motel featured in 'True Romance'.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1911+West+Olive+Avenue+Burbank,+CA" target="_blank" rel="noopener noreferrer">1911 West Olive Avenue Burbank, CA 91506</a></span></li><li>Chili John's<br>Historic chili parlor.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=2018+West+Burbank+Boulevard+Burbank,+CA" target="_blank" rel="noopener noreferrer">2018 West Burbank Boulevard Burbank, CA 91506</a></span></li><li>Otto's<br>A Hungarian Deli in Residential Burbank!<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=2320+West+Clark+Avenue+Burbank" target="_blank" rel="noopener noreferrer">2320 West Clark Avenue Burbank, CA 91506</a></span></li><li>The Burbank Studios<br>Formerly NBC Studios Burbank, Constructed 1952.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=3000+W+Alameda+Ave.+Burbank,+CA" target="_blank" rel="noopener noreferrer">3000 W Alameda Ave. Burbank, CA 91523</a></span></li></ul>` },
            { "id": "cadillac", "name": "Cadillac-Corning", "region": "Westside", "description": "", "subAreas": `<ul><li>The neighborhood originally called Cadillac–Corning adopted the name La Cienega Heights in 2003. Bounded by Cadillac Avenue, La Cienega Boulevard, Sawyer Street, and Robertson Boulevard, it encompasses roughly 10–18 square blocks of predominately single-family homes. Its demographic shifted from an early substantial Jewish population to primarily African American and Latino residents.</li></ul>` },
            { "id": "calabasas", "name": "Calabasas", "region": "Santa Monica Mountains", "description": "", "subAreas": `<ul><li><b>Bellagio</b><br>-</li><li><b>Calabasas Country Estates</b></li><li><b>Calabasas Highlands</b></li><li><b>Calabasas Hills</b></li><li><b>Calabasas Park Estates</b></li><li><b>Hidden Hills</b></li><li><b>Mountain View Estates</b></li><li><b>The Oaks of Calabasas</b></li><li><b>The Ridge</b></li><li><b>Vista Pointe</b></li><li><b>Westridge</b></li></ul>` },
            { "id": "cameo-plaza", "name": "Cameo Plaza", "region": "South L.A.", "description": "", "subAreas": `<ul><li><b>Cameo Woods (The "Insecure" Apartments)</b><br></li><li>This historic gated community (built 1949) is the heart of the Cameo Plaza neighborhood. It is famous as the primary filming location for Issa Dee's apartment complex ("The Dunes") in the HBO hit series Insecure. Its "garden city" design also appeared in The Rockford Files and Murder, She Wrote.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=5810+Bowcroft+St,+Los+Angeles,+CA+90016" target="_blank" rel="noopener noreferrer">5810 Bowcroft St, Los Angeles, CA 90016</a></span></li><li><b>Cameo Plaza Boundary Marker</b><br>The official city signs designating the "Cameo Plaza" neighborhood can be found along the La Cienega and Jefferson borders, marking this unique pocket of South L.A. distinct from the surrounding industrial and commercial zones.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=Jefferson+Blvd+&+La+Cienega+Blvd,+Los+Angeles,+CA+90016" target="_blank" rel="noopener noreferrer">Jefferson Blvd & La Cienega Blvd, Los Angeles, CA 90016</a></span></li></ul>` },
            { "id": "canoga-park", "name": "Canoga Park", "region": "San Fernando Valley", "description": "", "subAreas": `<ul><li><b>Canoga Park Hand Car Wash</b><br>A full-service hand car wash and gas station known for its long-standing presence on Topanga Canyon Blvd.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=6760+Topanga+Canyon+Blvd,+Canoga+Park,+CA+91303" target="_blank" rel="noopener noreferrer">6760 Topanga Canyon Blvd, Canoga Park, CA 91303</a></span></li><li><b>Canoga Park's "Funny Guitar Building"</b><br>Home to The Guitar Merchant, this building is a local landmark famous for the giant acoustic guitar sculpture mounted on its facade.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=7503+Topanga+Canyon+Blvd,+Canoga+Park,+CA+91303" target="_blank" rel="noopener noreferrer">7503 Topanga Canyon Blvd, Canoga Park, CA 91303</a></span></li><li><b>da Vinci Studios</b><br>A world-renowned dental laboratory often featured on makeover shows, located on the border of Canoga Park and West Hills.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=22135+Roscoe+Blvd,+West+Hills,+CA+91304" target="_blank" rel="noopener noreferrer">22135 Roscoe Blvd, West Hills, CA 91304</a></span></li><li><b>De Soto Pharmacy</b><br>A classic independent pharmacy that famously houses "Jerry's Soda Shoppe," serving nostalgic ice cream sodas and Lappert's ice cream.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=20914+Roscoe+Blvd,+Canoga+Park,+CA+91304" target="_blank" rel="noopener noreferrer">20914 Roscoe Blvd, Canoga Park, CA 91304</a></span></li><li><b>Longhorn Saloon</b><br>A historic western-style dive bar that was a fixture of the area; the location is now home to the British pub "Scotland Yard."<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=21211+Sherman+Way,+Canoga+Park,+CA+91303" target="_blank" rel="noopener noreferrer">21211 Sherman Way, Canoga Park, CA 91303</a></span></li><li><b>Orcutt Ranch</b><br>A 24-acre historical monument and park featuring a 1920s Spanish adobe residence, lush rose gardens, and citrus orchards.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=23600+Roscoe+Blvd,+Canoga+Park,+CA+91304" target="_blank" rel="noopener noreferrer">23600 Roscoe Blvd, Canoga Park, CA 91304</a></span></li><li><b>Owen Piano Co.</b><br>The former occupant of the "Funny Guitar Building" (now The Guitar Merchant), this was a long-running local piano store in the 1980s and 90s.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=7503+Topanga+Canyon+Blvd,+Canoga+Park,+CA+91303" target="_blank" rel="noopener noreferrer">7503 Topanga Canyon Blvd, Canoga Park, CA 91303</a></span></li><li><b>Robbins Bros</b><br>A massive jewelry retailer that bills itself as the "World's Biggest Engagement Ring Store," specializing in diamond rings.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=6645+Topanga+Canyon+Blvd,+Canoga+Park,+CA+91303" target="_blank" rel="noopener noreferrer">6645 Topanga Canyon Blvd, Canoga Park, CA 91303</a></span></li><li><b>Rocket Liquor</b><br>A popular local liquor store known for its retro signage and wide selection of spirits.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=21413+Vanowen+St,+Canoga+Park,+CA+91303" target="_blank" rel="noopener noreferrer">21413 Vanowen St, Canoga Park, CA 91303</a></span></li><li><b>West Valley Rubber Stamp</b><br>Originally located on Sherman Way, this specialist shop (now Infinity Stamps) creates custom stamps, leather stamps, and branding irons.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=8577+Canoga+Ave,+Canoga+Park,+CA+91304" target="_blank" rel="noopener noreferrer">8577 Canoga Ave, Canoga Park, CA 91304</a></span></li></ul>` },
            { "id": "carson", "name": "Carson", "region": "Harbor", "description": "", "subAreas": `<ul><li><b>Stevenson Park</b></li><li><b>Victoria Park</b></li><li><b>West Carson (Unincorporated)</b></li><li><b>Porsche Experience Center</b><br>A 53-acre facility with a 4-mile driver development track, simulator lab, and restaurant, built on the former site of a golf course.</li><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=19800+S+Main+St,+Carson,+CA+90745" target="_blank" rel="noopener noreferrer">19800 S Main St, Carson, CA 90745</a></span></li><li><b>The Goodyear Blimp Base</b><br></li><li>Since 1920, this airfield has been the West Coast home of the iconic Goodyear Blimp. It is one of the most recognizable landmarks for drivers on the 405 freeway.</li><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=19200+S.+Main+St,+Carson,+CA,+90248" target="_blank" rel="noopener noreferrer">19200 S. Main St, Carson, CA, 90248</a></span></li></ul>` },
            { "id": "carthay", "name": "Carthay", "region": "Central L.A.", "description": "", "subAreas": `<ul><li><b>Carthay Circle Historic Preservation Overlay Zone</b></li><li><b>Carthay Square Historic Preservation Overlay Zone</b></li><li><b>South Carthay Historic Preservation Overlay Zone</b></li><li><b>Site of the Carthay Circle Theatre</b><br>The site of the famous movie palace (demolished 1969) where Snow White and the Seven Dwarfs premiered in 1937. It is now a park and office buildings.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=6316+San+Vicente+Blvd,+Los+Angeles,+90048" target="_blank" rel="noopener noreferrer">6316 San Vicente Blvd, Los Angeles, 90048</a></span></li></ul>` },
            { "id": "castaic", "name": "Castaic", "region": "Santa Clarita Valley - Unincorporated", "description": "", "subAreas": `<ul><li><b>Castaic Junction</b></li><li><b>Hasley Canyon</b></li><li><b>Castaic Lake State Recreation Area</b><br></li><li>A massive reservoir and recreation area that serves as the terminus of the California Aqueduct's West Branch. Known for bass fishing and as a filming location for The dukes of Hazzard and Power Rangers.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=32132+Castaic+Lake+Dr,+Castaic,+CA+91384" target="_blank" rel="noopener noreferrer">32132 Castaic Lake Dr, Castaic, CA 91384</a></span></li><li><b>Violin Canyon</b><br>A historic canyon route named for the Violin Saddle, which connects the Ridge Route to the coastal valleys.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=Violin+Canyon+Rd,+Castaic,+CA+91384" target="_blank" rel="noopener noreferrer">Violin Canyon Rd, Castaic, CA 91384</a></span></li></ul>` },
            { "id": "central-alameda", "name": "Central-Alameda", "region": "South L.A.", "description": "", "subAreas": `<ul><li><b>Pueblo Del Rio Housing Projects</b><br>Home of the Pueblo Bishops Bloods<br></li><li><b>Slauson Recreation Center</b><br></li><li>**Slauson R.C. Theater</li></ul>` },
            { "id": "century-city", "name": "Century City", "region": "Westside", "description": "", "subAreas": `<ul><li><b>Fox Studio Lot</b></li><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=[10201+W+Pico+Blvd,+Los+Angeles,+CA+90064]" target="_blank" rel="noopener noreferrer">[10201 W Pico Blvd, Los Angeles, CA 90064]</a></span></li><li><br></li><li>Century City was built on the Fox Backlot. This is why the streets are named "Avenue of the Stars" and "Constellation Blvd." Fox sold the land to Alcoa in 1961 to avoid bankruptcy after Cleopatra flopped. In 1961, Fox sold 176 acres of backlot land to Alcoa—retaining and leasing back about 75 acres—to finance the creation of Century City.</li><li>It continues to operate as a fully-functioning studio facility, offering production and post-production services. Today the lot retains 15 soundstages, from Egyptian-themed halls to the famed scoring stage where The Sound of Music was recorded, plus backlot streets, commissary eateries, and state-of-the-art post-production suites.</li><li>Today the lot retains 15 soundstages, from Egyptian-themed halls to the famed scoring stage where The Sound of Music was recorded, plus backlot streets, commissary eateries, and state-of-the-art post-production suites.</li><li>It continues to operate as a fully-functioning studio facility, offering production and post-production services while preserving nearly a century of film and television heritage**</li><li><b>Fox Plaza ("Nakatomi Plaza")</b><br>The 34-story skyscraper that gained global fame as "Nakatomi Plaza" in the 1988 action classic Die Hard. It was unfinished at the time of filming, which allowed the production to use real construction floors. It also appears in Fight Club (destruction scene).</li><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=2121+Avenue+of+the+Stars,+Los+Angeles,+CA+90067" target="_blank" rel="noopener noreferrer">2121 Avenue of the Stars, Los Angeles, CA 90067</a></span></li></ul>` },
            { "id": "century-cove", "name": "Century Cove", "region": "South L.A.", "description": "", "subAreas": `<ul><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=Century+Blvd+&+Van+Ness+Ave,+Los+Angeles,+CA+90047" target="_blank" rel="noopener noreferrer">Century Blvd & Van Ness Ave, Los Angeles, CA 90047</a></span></li></ul>` },
            { "id": "century-palms", "name": "Century Palms", "region": "", "description": "", "subAreas": `<ul><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=E+99th+St+&+S+Central+Ave,+Los+Angeles,+CA+90002" target="_blank" rel="noopener noreferrer">E 99th St & S Central Ave, Los Angeles, CA 90002</a></span></li><li><b>1940s gas station</b><br>Excellent example of a 1940s gas station. One of only a few intact examples remaining in the city.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=10950+Avalon+Blvd,+Los+Angeles,+CA+90061" target="_blank" rel="noopener noreferrer">10950 Avalon Blvd, Los Angeles, CA 90061</a></span></li></ul>` },
            { "id": "cerritos", "name": "Cerritos", "region": "Southeast", "description": "", "subAreas": `<ul><li><b>Cerritos Auto Square</b><br>The world's largest auto mall, generating massive sales tax revenue for the city. A monument to Southern California's car culture.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=10901+Auto+Square+Dr,+Cerritos,+CA+90703" target="_blank" rel="noopener noreferrer">10901 Auto Square Dr, Cerritos, CA 90703</a></span></li><li><b>Cerritos Library</b><br>Famous for its titanium exterior, known as the "Experience Library," this titanium-clad futuristic building was the first titanium-paneled structure in the US (predating the Disney Concert Hall). It features a saltwater aquarium and an "Old World" reading room.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=18025+Bloomfield+Ave,+Cerritos,+CA+90703" target="_blank" rel="noopener noreferrer">18025 Bloomfield Ave, Cerritos, CA 90703</a></span></li></ul>` },
            { "id": "charter-oak", "name": "Charter Oak", "region": "San Gabriel Valley - Unincorporated", "description": "", "subAreas": `<ul><li><b>Charter Oak Park</b><br>The recreational heart of this unincorporated community, featuring sports fields and picnic areas. The name "Charter Oak" refers to the election tree in Tulare County (a historical misnomer transferred by settlers), but this park defines the local SGV identity.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=20261+E+Covina+Blvd,+Covina,+CA+91724" target="_blank" rel="noopener noreferrer">20261 E Covina Blvd, Covina, CA 91724</a></span></li></ul>` },
            { "id": "chatsworth", "name": "Chatsworth", "region": "San Fernando Valley", "description": "", "subAreas": `<ul><li><b>Stoney Point Park</b><br>A jagged rock formation that serves as one of the birthplaces of American rock climbing. It has doubled for the Old West, alien planets, and prehistoric landscapes in hundreds of films.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=Topanga+Canyon+Blvd,+Chatsworth,+CA+91311" target="_blank" rel="noopener noreferrer">Topanga Canyon Blvd, Chatsworth, CA 91311</a></span></li><li><b>Iverson Movie Ranch (Site of)</b><br>Once the most-filmed location ranch in history, hosting The Lone Ranger, The African Queen, and Bonanza. While now largely condos, the "Garden of the Gods" rock formations remain preserved.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1+Iverson+Ln,+Chatsworth,+CA+91311" target="_blank" rel="noopener noreferrer">1 Iverson Ln, Chatsworth, CA 91311</a></span></li><li><b>Spahn Ranch (Site of)</b><br>The infamous 55-acre movie ranch where the Manson Family lived in 1968-1969. The buildings burned down in 1970, and the site is now part of the Santa Susana Pass State Historic Park.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=12000+Santa+Susana+Pass+Rd,+Chatsworth,+CA+91311" target="_blank" rel="noopener noreferrer">12000 Santa Susana Pass Rd, Chatsworth, CA 91311</a></span></li><li><b>The Munch Box</b><br>A bright yellow burger stand designated as Los Angeles Historic-Cultural Monument #750. It is a quintessential example of 1950s roadside architecture.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=21532+Devonshire+St,+Chatsworth,+CA+91311" target="_blank" rel="noopener noreferrer">21532 Devonshire St, Chatsworth, CA 91311</a></span></li></ul>` },
            { "id": "chesterfield-square", "name": "Chesterfield Square", "region": "South L.A.", "description": "", "subAreas": `<ul><li><b>Chesterfield Square Park</b><br>A pocket park that serves as the community center for this residential neighborhood, featuring playgrounds and picnic areas.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1950+W+54th+St,+Los+Angeles,+CA+90062" target="_blank" rel="noopener noreferrer">1950 W 54th St, Los Angeles, CA 90062</a></span></li></ul>` },
            { "id": "cheviot-hills", "name": "Cheviot Hills", "region": "Westside", "description": "", "subAreas": `<ul><li><b>Modern Family house</b><br>The traditional suburban home used as the exterior for Phil and Claire Dunphy's house in the hit series Modern Family.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=2211+Fox+Hills+Dr,+Los+Angeles,+CA+90064" target="_blank" rel="noopener noreferrer">2211 Fox Hills Dr, Los Angeles, CA 90064</a></span></li><li><b>Rancho Park Golf Course</b><br>One of the busiest public golf courses in the US. It hosted the LA Open 18 times and is famous for being the course where President Bill Clinton played (and caused traffic jams).<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=10460+W+Pico+Blvd,+Los+Angeles,+CA+90064" target="_blank" rel="noopener noreferrer">10460 W Pico Blvd, Los Angeles, CA 90064</a></span></li></ul>` },
            { "id": "chinatown", "name": "Chinatown", "region": "Central L.A.", "description": "", "subAreas": `<ul><li><b>Central Plaza</b><br>The neon-lit heart of "New Chinatown," built in 1938 after the original Chinatown was demolished for Union Station. Designed by Hollywood set designers, it features the Golden Pagoda and the Seven Star Cavern.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=943+N+Broadway,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">943 N Broadway, Los Angeles, CA 90012</a></span></li><li><b>Former "Little Italy"</b><br>Before it was Chinatown, this area was the hub of LA's Italian population. St. Peter's Italian Church is a surviving remnant of this era.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1039+N+Broadway,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">1039 N Broadway, Los Angeles, CA 90012</a></span></li><li><b>William Mead Homes ("Dogtown")</b><br>A public housing project built in 1942. The nickname "Dogtown" (predating the Santa Monica skater version) allegedly comes from the meatpacking plants that once operated nearby.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1300+Cardinal+St,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">1300 Cardinal St, Los Angeles, CA 90012</a></span></li><li><b>Philippe The Original</b><br>One of two claimants to the invention of the French Dip sandwich (opened 1908). Famous for sawdust on the floors and spicy mustard.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1001+N+Alameda+St,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">1001 N Alameda St, Los Angeles, CA 90012</a></span></li><li>**Broadway at College. Now-shuttered Italian restaurant called Little Joe's Italian Restaurant in Chinatown. This is a testament of the former Italian American community that once populated the site of today's Chinatown. Little Joe's was one of the last holdouts of the Italian community that was displaced to build the current Chinatown (New Chinatown) in the 1930s.</li><li><b>Bruce Lee's former martial arts studio</b></li><li>**Chinese American Museum 'Symbolically housed in the oldest and last surviving structure of Los Angeles’ original Chinatown'</li><li><b>- </b><br>Chinese Historical Society**-</li><li><b>Christine's house in Drag Me To Hell</b><br>-</li><li><b>Fun On Foods Inc.</b></li><li><b>Madame Wong's was important in LA Punk History</b></li><li><b>Minnie Hill Palmer House </b></li><li><b>My Dung Sandwich Shop</b></li><li><b>Naud Junction (Historic Name)</b></li><li><b>Nick's Cafe</b></li><li><b>Phoenix Bakery Famous Birthday Cakes</b></li><li><b>St. Anthony's Croatian Church Croatian Church in Chinatown</b></li><li><b>Sunny's Market</b></li><li><b>Tak Shing Hong Herbalist and Folk Medicine Logo</b></li><li><b>Ten Ren, for Boba, and 736 N Broadway, for Banh Mi</b></li><li><b>Thien Hau Temple, also known as Chùa Bà Thiên Hậu in Vietnamese and as Tiān Hòu Gōng (天后宫) in Chinese, is a Taoist temple in Los Angeles Chinatown</b></li><li><b>William Mead Homes public housing project also known as "Dogtown"</b><br>The name allegedly comes from the nearby rail yards where stray dogs would gather to eat scraps, or possibly from the "Dog Town" meatpacking district that preceded it. This is the actual origin of the "Dogtown" moniker that skaters later adopted in Santa Monica (Dogtown & Z-Boys), though the two are often confused.</li><li><b>Women's Art Building</b></li></ul>` },
            { "id": "citrus-unincorporated-covina", "name": "Citrus (unincorporated Covina)", "region": "", "description": "", "subAreas": `<ul><li><b>Citrus College</b><br>The oldest community college in Los Angeles County (est. 1915). While technically in Glendora, it is the namesake and cultural anchor of the Citrus CDP.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1000+W+Foothill+Blvd,+Glendora,+CA+91741" target="_blank" rel="noopener noreferrer">1000 W Foothill Blvd, Glendora, CA 91741</a></span></li></ul>` },
            { "id": "city-of-industry", "name": "City of Industry", "region": "San Gabriel Valley", "description": "", "subAreas": `<ul><li>**Puente Junction</li><li><b>Puente Hills Mall <br>("Twin Pines Mall")</b><br></li><li>The filming location for the Twin Pines Mall (later Lone Pine Mall) in Back to the Future (1985). This is where Doc Brown unveils the DeLorean and the Libyans attack.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1600+S+Azusa+Ave,+City+of+Industry,+CA+91748" target="_blank" rel="noopener noreferrer">1600 S Azusa Ave, City of Industry, CA 91748</a></span></li><li><b>Workman and Temple Family Homestead Museum</b><br></li><li>A six-acre historic site featuring the Workman House (1870s) and La Casa Nueva (1920s), preserving the history of the region's transition from Mexican Rancho to industrial hub.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=15415+Don+Julian+Rd,+City+of+Industry,+CA+91745" target="_blank" rel="noopener noreferrer">15415 Don Julian Rd, City of Industry, CA 91745</a></span></li></ul>` },
            { "id": "claremont", "name": "Claremont", "region": "Pomona Valley", "description": "", "subAreas": `<ul><li><b>Claremont Village</b><br>A walkable downtown district filled with Tudor Revival architecture, boutiques, and bakeries. It gives Claremont its reputation as a "New England college town" in California.</li><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=205+Yale+Ave,+Claremont,+CA+91711" target="_blank" rel="noopener noreferrer">205 Yale Ave, Claremont, CA 91711</a></span></li><li><b>California Botanic Garden</b><br>The largest botanic garden dedicated to California native plants, covering 86 acres on the alluvial fan of the San Gabriel Mountains.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1500+N+College+Ave,+Claremont,+CA+91711" target="_blank" rel="noopener noreferrer">1500 N College Ave, Claremont, CA 91711</a></span></li><li><b>The Claremont Colleges</b><br>A consortium of seven prestigious institutions (Pomona, Scripps, Claremont McKenna, Harvey Mudd, Pitzer, KGI, CGU) sharing a contiguous campus.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=747+N+Dartmouth+Ave,+Claremont,+CA+91711" target="_blank" rel="noopener noreferrer">747 N Dartmouth Ave, Claremont, CA 91711</a></span></li></ul>` },
            { "id": "commerce", "name": "Commerce", "region": "Southeast", "description": "", "subAreas": `<ul><li><b>Citadel Outlets</b><br>Housed behind the grandiose, Assyrian-style wall of the former Samson Tire and Rubber Company (built 1929). The facade is modeled after the palace of King Sargon II.</li><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=100+Citadel+Dr,+Commerce,+CA+90040" target="_blank" rel="noopener noreferrer">100 Citadel Dr, Commerce, CA 90040</a></span></li><li><b>Commerce Casino</b><br>One of the world's largest cardrooms, known for hosting major poker tournaments. It accounts for a massive portion of the city's tax revenue.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=6131+Telegraph+Rd,+Commerce,+CA+90040" target="_blank" rel="noopener noreferrer">6131 Telegraph Rd, Commerce, CA 90040</a></span></li></ul>` },
            { "id": "compton", "name": "Compton", "region": "Southeast", "description": "", "subAreas": `<ul><li><b>"Bompton"</b><br>Bompton is the stronghold of the Bloods gangs in Compton. It is a colloquial reality, even if not an "official" sub-area. This term (replacing the 'C' with a 'B' due to Bloods gang affiliation) was popularized globally by rappers like YG and Kendrick Lamar. "Bompton" includes Centennial High School, Enterprise Park, Gonzales Park, and Piru Street.</li><li><b>East Rancho Dominguez (formerly known as East Compton)</b></li><li><b>Rosewood</b></li><li><b>West Rancho Dominguez (formerly known as West Compton and sometimes known as East Gardena)</b></li><li><b>Dr. Dre's Childhood Home</b><br>The early home of Andre Young (Dr. Dre), a founding member of N.W.A. and a pivotal figure in the G-Funk era.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1250+E+125th+St,+Compton,+CA+90222+(Approximate)" target="_blank" rel="noopener noreferrer">1250 E 125th St, Compton, CA 90222 (Approximate)</a></span></li><li><b>Kendrick Lamar's Childhood Home</b><br>The modest home where the Pulitzer Prize-winning rapper grew up, often referenced in his album Good Kid, M.A.A.D City.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1612+W+137th+St,+Compton,+CA+90222" target="_blank" rel="noopener noreferrer">1612 W 137th St, Compton, CA 90222</a></span></li></ul>` },
            { "id": "covina", "name": "Covina", "region": "San Gabriel Valley", "description": "", "subAreas": `<ul><li>**Citrus</li><li>**Covina islands</li><li>Unincorporated</li><li><b>East Covina</b></li><li><b>West Covina</b></li><li><b>Vincent</b></li><li><b>Covina Bowl (Historic)</b><br>A legendary example of Googie architecture. While the bowling alley closed in 2017, the jagged roofline and signage were preserved and integrated into a new housing development.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1060+W+San+Bernardino+Rd,+Covina,+CA+91722" target="_blank" rel="noopener noreferrer">1060 W San Bernardino Rd, Covina, CA 91722</a></span></li></ul>` },
            { "id": "crenshaw", "name": "Crenshaw District", "region": "South L.A.", "description": "", "subAreas": `<ul><li><b>Crenshaw Manor</b></li><li><b>Crenshaw Seinan Historic District</b></li><li><b>The Crenshaw Wall ("Our Mighty Contribution")</b><br></li><li>A historic 780-foot long mural depicting the history of African Americans from ancient Egypt to the present day. It is the centerpiece of the "Destination Crenshaw" open-air museum project.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=4911+Crenshaw+Blvd,+Los+Angeles,+CA+90043" target="_blank" rel="noopener noreferrer">4911 Crenshaw Blvd, Los Angeles, CA 90043</a></span></li><li><b>Baldwin Hills Crenshaw Plaza</b><br>A historic shopping mall (originally the Broadway-Crenshaw Center, built 1947) that has served as a primary economic hub for the Black community in Los Angeles for decades.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=3650+W+Martin+Luther+King+Jr+Blvd,+Los+Angeles,+CA+90008" target="_blank" rel="noopener noreferrer">3650 W Martin Luther King Jr Blvd, Los Angeles, CA 90008</a></span></li></ul>` },
            { "id": "crestview", "name": "Crestview", "region": "Westside", "description": "", "subAreas": `<ul><li><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=Cadillac+Ave+&+La+Cienega+Blvd,+Los+Angeles,+CA+90034" target="_blank" rel="noopener noreferrer">Cadillac Ave & La Cienega Blvd, Los Angeles, CA 90034</a></span></li></ul>` },
            { "id": "crystalaire", "name": "Crystalaire", "region": "Antelope Valley - Unincorporated", "description": "", "subAreas": `<ul><li><b>Crystalaire Country Club</b><br>A private golf course and country club located in the high desert near Llano. It also features a gliderport (Crystal Airport) popular for soaring due to the desert thermals.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=15701+Boca+Raton+Ave,+Llano,+CA+93544" target="_blank" rel="noopener noreferrer">15701 Boca Raton Ave, Llano, CA 93544</a></span></li></ul>` },
            { "id": "cudahy", "name": "Cudahy", "region": "Southeast", "description": "", "subAreas": `<ul><li><b>Clara Street Park</b><br>The central recreational hub for one of the densest and smallest cities in California. It hosts major community events and musical festivals.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=4835+Clara+St,+Cudahy,+CA+90201" target="_blank" rel="noopener noreferrer">4835 Clara St, Cudahy, CA 90201</a></span></li></ul>` },
            { "id": "culver-city", "name": "Culver City", "region": "Westside", "description": "", "subAreas": `<ul><li><b>Blair Hills</b></li><li><b>Blanco/Culver Crest</b></li><li><b>Carlson Park</b></li><li><b>Clarkdale</b></li><li><b>Culver City Arts District</b></li><li><b>Culver/West</b></li><li><b>Downtown Culver City</b></li><li><b>Fox Hills</b></li><li><b>Jefferson</b></li><li><b>Lucerne/Higuera</b></li><li><b>McLaughlin</b></li><li><b>McManus</b></li><li><b>Park East</b></li><li><b>Park West</b></li><li><b>Studio Village</b></li><li><b>Sunkist Park</b></li><li><b>Syd Kronenthal Park</b></li><li><b>Washington Culver</b></li><li><b>West Fox Hills</b></li><li><b>Lawrence & Martha Joseph Residence<br>("The Hobbit House")</b><br>The Lawrence and Martha Joseph Residence and Apartments, often called the Hobbit Houses,are a landmarked example of the Storybook style of architecture in Los Angeles, California. The informal name "Hobbit House" is due to their supposed resemblance to the architecture of Tolkien's Shire. Accurately described as Storybook Style, these "Disney-esque" cottages were a specific LA trend in the 1920s/30s, often built by set designers or eccentric builders (like Lawrence Joseph) who wanted to bring movie magic to residential streets.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=3819+Dunn+Dr,+Culver+City,+CA+90232" target="_blank" rel="noopener noreferrer">3819 Dunn Dr, Culver City, CA 90232</a></span></li></ul>` },
            { "id": "cypress-park", "name": "Cypress Park", "region": "Northeast L.A.", "description": "", "subAreas": `<ul><li><b>Huron Substation</b><br></li><li>Built in 1906 to power the Yellow Car streetcars, this historic brick building is the second-oldest surviving substation in the city. It is now a popular event venue and filming location (featured in Fast & Furious, NCIS).<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=2640+Huron+St,+Los+Angeles,+CA+90065" target="_blank" rel="noopener noreferrer">2640 Huron St, Los Angeles, CA 90065</a></span></li><li><b>Rio de Los Angeles State Park</b><br>A state park built on the former Taylor Yard rail facility, offering wetlands restoration and sports fields. It symbolizes the revitalization of the LA River.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=1900+N+San+Fernando+Rd,+Los+Angeles,+CA+90065" target="_blank" rel="noopener noreferrer">1900 N San Fernando Rd, Los Angeles, CA 90065</a></span></li></ul>` },

            { "id": "downtown-la", "name": "Downtown LA", "region": "Central L.A.", "description": "", "subAreas": `<ul><li><b>Angels Flight Railway</b><br>The iconic funicular railway connecting Hill Street and Olive Street on Bunker Hill.<br><span class="location">📍 <a href="https://maps.google.com/?q=351+S+Hill+St,+Los+Angeles,+CA+90013" target="_blank" rel="noopener noreferrer">351 S Hill St, Los Angeles, CA 90013</a></span></li><li><b>Avila Adobe</b><br>The oldest standing residence in Los Angeles, built in 1818 on Olvera Street.<br><span class="location">📍 <a href="https://maps.google.com/?q=10+Olvera+St,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">10 Olvera St, Los Angeles, CA 90012</a></span></li><li><b>Bradbury Building</b><br>A 1893 architectural masterpiece famous for its skylit atrium and ornate ironwork (featured in Blade Runner).<br><span class="location">📍 <a href="https://maps.google.com/?q=304+S+Broadway,+Los+Angeles,+CA+90013" target="_blank" rel="noopener noreferrer">304 S Broadway, Los Angeles, CA 90013</a></span></li><li><b>Eastern Columbia Building</b><br>An Art Deco jewel known for its turquoise terra cotta facade and clock tower.<br><span class="location">📍 <a href="https://maps.google.com/?q=849+S+Broadway,+Los+Angeles,+CA+90014" target="_blank" rel="noopener noreferrer">849 S Broadway, Los Angeles, CA 90014</a></span></li><li><b>Little Tokyo Historic District</b><br>One of only three official Japantowns in the United States, preserving over a century of Japanese-American history.<br><span class="location">📍 <a href="https://maps.google.com/?q=316+E+1st+St,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">316 E 1st St, Los Angeles, CA 90012</a></span></li><li><b>Los Angeles Central Library</b><br>The Goodhue-designed landmark featuring a tiled pyramid tower and rotunda.<br><span class="location">📍 <a href="https://maps.google.com/?q=630+W+5th+St,+Los+Angeles,+CA+90071" target="_blank" rel="noopener noreferrer">630 W 5th St, Los Angeles, CA 90071</a></span></li><li><b>Union Station</b><br>The "Last of the Great Railway Stations," blending Spanish Colonial, Mission Revival, and Art Deco styles.<br><span class="location">📍 <a href="https://maps.google.com/?q=800+N+Alameda+St,+Los+Angeles,+CA+90012" target="_blank" rel="noopener noreferrer">800 N Alameda St, Los Angeles, CA 90012</a></span></li><li><b>Arts District</b></li><li><b>Bunker Hill</b></li><li><b>Civic Center</b></li><li><b>Fashion District</b></li><li><b>Financial District</b></li><li><b>Historic Core</b></li><li><b>Jewelry District</b></li><li><b>Old Bank District</b></li><li><b>South Park</b></li><li><b>Skid Row / Central City East</b></li><li><b>Toy District</b></li><li><b>Wholesale District</b></li></ul>` },
            { "id": "duarte", "name": "Duarte", "region": "San Gabriel Valley", "description": "", "subAreas": `<ul><li>Fish Canyon Falls<br>A tiered 80-foot waterfall on a 5-mile round-trip trail through Fish Canyon in the San Gabriel Mountains, the falls have drawn hikers since newspaper-described visits in 1936 and the 1880s guest ranch era.<br><span class="location">📍 <a href="https://www.google.com/maps/search/?api=1&query=34.181100," target="_blank" rel="noopener noreferrer">34.181100,</a></span></li><li>117.925500(https://www.google.com/maps/search/?api=1&query=34.181100,+-117.925500)</li></ul>` },

        // --- 2. LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('contentArea');
            const searchInput = document.getElementById('neighborhoodSearch');
            const clearBtn = document.getElementById('clearSearch');
            const filterContainer = document.getElementById('filterContainer');
            const loading = document.getElementById('loading');
            const alphabetNav = document.getElementById('alphabetNav');

            // 2a. Init
            let activeRegion = null;

            // Generate Alphabet
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
            alphabetNav.innerHTML = letters.map(l => `<a href="#${l.toLowerCase()}-section">${l}</a>`).join('');

            /*
            // Generate Regions
            const uniqueRegions = [...new Set(neighborhoodData.map(item => item.region).filter(Boolean))].sort();
            let chipsHtml = `<button class="filter-chip active" data-region="all">All Regions</button>`;
            uniqueRegions.forEach(region => {
                chipsHtml += `<button class="filter-chip" data-region="${region}">${region}</button>`;
            });
            filterContainer.innerHTML = `<div class="filter-scroll">${chipsHtml}</div>`;
            */

            // 2b. Render
            function render(data) {
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="no-results">
                            <h3>No locations found</h3>
                            <p>Try adjusting your search or filters.</p>
                        </div>
                    `;
                    updateAlphabetNav([]);
                    return;
                }

                // Group by First Letter
                const grouped = data.reduce((acc, item) => {
                    const letter = item.name.charAt(0).toUpperCase();
                    if (!acc[letter]) acc[letter] = [];
                    acc[letter].push(item);
                    return acc;
                }, {});

                const activeLetters = Object.keys(grouped).sort();

                activeLetters.forEach(letter => {
                    const section = document.createElement('section');
                    section.id = `${letter.toLowerCase()}-section`;
                    section.className = 'alphabet-section';

                    const header = document.createElement('div');
                    header.className = 'alphabet-letter';
                    header.textContent = letter;
                    section.appendChild(header);

                    // SORT ALPHABETICALLY WITHIN SECTION
                    const sortedItems = grouped[letter].sort((a, b) => a.name.localeCompare(b.name));

                    sortedItems.forEach(item => {
                        const card = document.createElement('article');
                        card.className = 'neighborhood-card';

                        let detailsHtml = '';
                        if (item.description) detailsHtml += `<div class="description">${item.description}</div>`;
                        if (item.subAreas) detailsHtml += `<div class="sub-areas">${item.subAreas}</div>`;
                        if (item.region) detailsHtml += `<span class="region">${item.region}</span>`;

                        card.innerHTML = `
                            <div class="neighborhood-header">
                                <h2>${item.name}</h2>
                                <svg class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                            <div class="neighborhood-content">
                                <div class="neighborhood-details">
                                    ${detailsHtml}
                                </div>
                            </div>
                        `;

                        card.querySelector('.neighborhood-header').addEventListener('click', () => {
                            card.classList.toggle('expanded');
                        });

                        section.appendChild(card);
                    });

                    container.appendChild(section);
                });

                updateAlphabetNav(activeLetters);
            }

            function updateAlphabetNav(activeLetters) {
                const links = alphabetNav.querySelectorAll('a');
                links.forEach(link => {
                    const letter = link.textContent;
                    if (activeLetters.includes(letter)) {
                        link.classList.remove('disabled');
                        link.style.pointerEvents = 'auto';
                    } else {
                        link.classList.add('disabled');
                        link.style.pointerEvents = 'none';
                    }
                });
            }

            function filterData() {
                const searchTerm = searchInput.value.toLowerCase();

                const filtered = neighborhoodData.filter(item => {
                    const matchesSearch =
                        item.name.toLowerCase().includes(searchTerm) ||
                        (item.description && item.description.toLowerCase().includes(searchTerm)) ||
                        (item.subAreas && item.subAreas.toLowerCase().includes(searchTerm));

                    const matchesRegion = activeRegion === 'all' || !activeRegion || item.region === activeRegion;

                    return matchesSearch && matchesRegion;
                });

                render(filtered);
                clearBtn.style.display = searchTerm ? 'flex' : 'none';
            }

            searchInput.addEventListener('input', filterData);

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                filterData();
                searchInput.focus();
            });

            /*
            filterContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-chip') || e.target.closest('.filter-chip')) {
                    const chip = e.target.classList.contains('filter-chip') ? e.target : e.target.closest('.filter-chip');
                    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    activeRegion = chip.dataset.region;
                    filterData();
                }
            });
            */

            // Back to Top
            const backToTopBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) backToTopBtn.classList.add('visible');
                else backToTopBtn.classList.remove('visible');
            });
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Handle Hash
            if (window.location.hash) {
                setTimeout(() => {
                    const el = document.querySelector(window.location.hash);
                    if (el) el.scrollIntoView();
                }, 100);
            }

            // Init
            render(neighborhoodData);
            setTimeout(() => {
                loading.classList.add('hidden');
                setTimeout(() => loading.remove(), 500);
            }, 500);
        });

        // Loader Animation
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin { to { transform: rotate(360deg); } }
        `;
        document.head.appendChild(styleSheet);
    </script>
