<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.A. Community Directory</title>
    <meta name="description"
        content="Comprehensive gazetteer of all neighborhoods, cities, and communities in Los Angeles County">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CORE VARIABLES --- */
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1e40af;
            --secondary-color: #64748b;
            --accent-color: #0ea5e9;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 2. RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--background);
            -webkit-font-smoothing: antialiased;
        }

        /* --- 3. LAYOUT CONTAINER --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            min-height: 100vh;
        }

        /* --- 4. HEADER --- */
        .directory-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .directory-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .directory-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* --- 5. SEARCH BAR --- */
        .search-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: transparent;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #neighborhoodSearch {
            width: 100%;
            padding: 0.75rem 2.5rem 0.75rem 1.25rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            background: white;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }

        #neighborhoodSearch:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .clear-btn {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--secondary-color);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .clear-btn:hover {
            background: var(--text-primary);
        }

        /* --- 6. FILTER CHIPS (MODIFIED FOR GRID) --- */
        .filter-container {
            margin-bottom: 3rem;
            /* Removed overflow-x: auto */
            text-align: center;
        }

        .filter-scroll {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* 4 columns per line */
            gap: 0.75rem;
            width: 100%;
            padding: 0;
        }

        .filter-chip {
            padding: 0.75rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            /* Slightly squarer for grid */
            background: white;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.75rem;
            font-weight: 500;

            /* Center content and allow multi-line for long region names */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            height: 100%;
        }

        .filter-chip:hover {
            background: var(--surface);
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        /* --- 7. ALPHABET NAV --- */
        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 3rem;
            padding: 1.25rem;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .alphabet-nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: white;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .alphabet-nav a:hover:not(.disabled) {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .alphabet-nav a.disabled {
            opacity: 0.4;
            cursor: default;
            background: transparent;
            border-color: transparent;
            color: var(--text-secondary);
        }

        /* --- 8. DIRECTORY CARDS --- */
        .alphabet-section {
            margin-bottom: 3rem;
            scroll-margin-top: 1rem;
        }

        .alphabet-letter {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--background);
            z-index: 10;
        }

        .neighborhood-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1rem;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            overflow: hidden;
        }

        .neighborhood-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        .neighborhood-header {
            padding: 1.5rem 2rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .neighborhood-header h2 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin: 0;
            font-weight: 600;
        }

        .toggle-icon {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
            color: var(--secondary-color);
        }

        .neighborhood-card.expanded .toggle-icon {
            transform: rotate(180deg);
            color: var(--primary-color);
        }

        .neighborhood-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease;
            opacity: 0;
            background: #fafafa;
        }

        .neighborhood-card.expanded .neighborhood-content {
            max-height: 10000px;
            opacity: 1;
            border-top: 1px solid var(--border-color);
        }

        .neighborhood-details {
            padding: 2rem;
        }

        .description {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        /* Sub-Area Styling */
        .sub-areas {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .sub-areas h3 {
            font-size: 1.1rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            margin-top: 1rem;
        }

        .sub-areas h3:first-child {
            margin-top: 0;
        }

        .sub-areas p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .sub-areas ul {
            list-style: none;
            padding-left: 0;
            /* Two-column layout for long lists */
            column-count: 2;
            column-gap: 2rem;
        }

        /* Prevent list items from breaking across columns */
        .sub-areas li {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
            padding: 1rem 0;
            border-bottom: 1px dashed var(--border-color);
            color: var(--text-secondary);
        }

        .sub-areas li:last-child {
            border-bottom: none;
        }

        .sub-areas li ul {
            margin-left: 1rem;
            border-left: 2px solid var(--border-color);
            padding-left: 1rem;
            margin-top: 0.5rem;
        }

        .sub-areas li ul li {
            border-bottom: none;
            padding: 0.25rem 0;
            font-size: 0.9em;
        }

        .sub-areas .location {
            font-family: monospace;
            font-size: 0.9rem;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 0.25rem;
        }

        .sub-areas a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .sub-areas a:hover {
            text-decoration: underline;
        }

        .region {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.25rem 0.75rem;
            background: var(--primary-color);
            color: white;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        
/* --- NEW TAXONOMY STYLES --- */
        .structured-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .loc-section h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--secondary-color);
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.25rem;
        }

        /* Sub-neighborhood Pills */
        .pill-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .loc-pill {
            background: #f1f5f9;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid transparent;
        }

        /* Landmark Grid */
        .landmark-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .landmark-list li {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .landmark-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .landmark-header strong {
            font-size: 0.95rem;
            color: var(--primary-dark);
            line-height: 1.3;
        }

        .map-link {
            text-decoration: none;
            margin-left: 0.5rem;
            filter: grayscale(100%);
        }

        .landmark-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .landmark-addr {
            display: block;
            font-size: 0.75rem;
            font-family: monospace;
            color: #94a3b8;
            margin-top: auto;
        }

        /* --- 9. UTILITIES --- */
        .no-results {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
            background: white;
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            z-index: 1000;
        }

        .back-to-top:hover {
            background: var(--primary-dark);
            transform: translateY(-4px);
        }

        .back-to-top.visible {
            display: flex;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 640px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .directory-header h1 {
                font-size: 1.75rem;
            }

            .alphabet-letter {
                font-size: 2.5rem;
                top: -1px;
            }

            /* Force 2 columns on small mobile screens if 4 is too cramped, or keep 4 if explicitly desired. 
               Given "4 per line" request, I will leave it as grid 4 unless it breaks severely. 
               Adding a safe fallback for very small screens just in case. */
            .filter-scroll {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 641px) {
            .filter-scroll {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="loading" id="loading">
        <div style="text-align: center;">
            <div
                style="width: 50px; height: 50px; border: 4px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 1rem;">
            </div>
            <p style="color: var(--text-secondary); font-weight: 500;">Loading Directory...</p>
        </div>
    </div>

    <div class="container">

        <header class="directory-header">
            <h1>L.A. Community Directory</h1>
            <p>A comprehensive A-Z gazetteer of neighborhoods and cities</p>
        </header>

        <div class="search-container">
            <input type="text" id="neighborhoodSearch" placeholder="Search Los Angeles County...."
                aria-label="Search neighborhoods">
            <button id="clearSearch" class="clear-btn" aria-label="Clear search">✕</button>
        </div>

        <nav class="alphabet-nav" id="alphabetNav"></nav>
        <!-- Region filters hidden per request -->
        <!-- <div class="filter-container" id="filterContainer"></div> -->

        <main id="contentArea"></main>

    </div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

    <script src="neighborhoods.js"></script>
<script>
        // --- 1. DATASET ---
        // Merged data: includes comprehensive list from B with detailed updates from A
        // Data loaded from neighborhoods.js

        // --- 2. LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('contentArea');
            const searchInput = document.getElementById('neighborhoodSearch');
            const clearBtn = document.getElementById('clearSearch');
            const filterContainer = document.getElementById('filterContainer');
            const loading = document.getElementById('loading');
            const alphabetNav = document.getElementById('alphabetNav');

            // 2a. Init
            let activeRegion = null;

            // Generate Alphabet
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
            alphabetNav.innerHTML = letters.map(l => `<a href="#${l.toLowerCase()}-section">${l}</a>`).join('');

            /*
            // Generate Regions
            const uniqueRegions = [...new Set(neighborhoodData.map(item => item.region).filter(Boolean))].sort();
            let chipsHtml = `<button class="filter-chip active" data-region="all">All Regions</button>`;
            uniqueRegions.forEach(region => {
                chipsHtml += `<button class="filter-chip" data-region="${region}">${region}</button>`;
            });
            filterContainer.innerHTML = `<div class="filter-scroll">${chipsHtml}</div>`;
            */

            // 2b. Render
            function render(data) {
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="no-results">
                            <h3>No locations found</h3>
                            <p>Try adjusting your search or filters.</p>
                        </div>
                    `;
                    updateAlphabetNav([]);
                    return;
                }

                // Group by First Letter
                const grouped = data.reduce((acc, item) => {
                    const letter = item.name.charAt(0).toUpperCase();
                    if (!acc[letter]) acc[letter] = [];
                    acc[letter].push(item);
                    return acc;
                }, {});

                const activeLetters = Object.keys(grouped).sort();

                activeLetters.forEach(letter => {
                    const section = document.createElement('section');
                    section.id = `${letter.toLowerCase()}-section`;
                    section.className = 'alphabet-section';

                    const header = document.createElement('div');
                    header.className = 'alphabet-letter';
                    header.textContent = letter;
                    section.appendChild(header);

                    // SORT ALPHABETICALLY WITHIN SECTION
                    const sortedItems = grouped[letter].sort((a, b) => a.name.localeCompare(b.name));

                    sortedItems.forEach(item => {
                        const card = document.createElement('article');
                        card.className = 'neighborhood-card';

                        let detailsHtml = '';
                        if (item.description) detailsHtml += `<div class="description">${item.description}</div>`;


                    if (item.locations && item.locations.length > 0) {
                        const subNeighborhoods = item.locations.filter(l => l.type === 'sub-neighborhood');
                        const landmarks = item.locations.filter(l => l.type === 'landmark');

                        detailsHtml += `<div class="structured-content">`;

                        if (subNeighborhoods.length > 0) {
                            detailsHtml += `<div class="loc-section">
                                <h4>Sub-Areas & Enclaves</h4>
                                <div class="pill-grid">
                                    ${subNeighborhoods.map(l => `<span class="loc-pill">${l.name}</span>`).join('')}
                                </div>
                            </div>`;
                        }

                        if (landmarks.length > 0) {
                            detailsHtml += `<div class="loc-section">
                                <h4>Points of Interest</h4>
                                <ul class="landmark-list">
                                    ${landmarks.map(l => `
                                        <li>
                                            <div class="landmark-header">
                                                <strong>${l.name}</strong>
                                                ${l.mapUrl ? `<a href="${l.mapUrl}" target="_blank" class="map-link">📍</a>` : ''}
                                            </div>
                                            ${l.description ? `<p class="landmark-desc">${l.description}</p>` : ''}
                                            ${l.address ? `<small class="landmark-addr">${l.address}</small>` : ''}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>`;
                        }
                        
                        detailsHtml += `</div>`;
                    }


                        if (item.region) detailsHtml += `<span class="region">${item.region}</span>`;

                        card.innerHTML = `
                            <div class="neighborhood-header">
                                <h2>${item.name}</h2>
                                <svg class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                            <div class="neighborhood-content">
                                <div class="neighborhood-details">
                                    ${detailsHtml}
                                </div>
                            </div>
                        `;

                        card.querySelector('.neighborhood-header').addEventListener('click', () => {
                            card.classList.toggle('expanded');
                        });

                        section.appendChild(card);
                    });

                    container.appendChild(section);
                });

                updateAlphabetNav(activeLetters);
            }

            function updateAlphabetNav(activeLetters) {
                const links = alphabetNav.querySelectorAll('a');
                links.forEach(link => {
                    const letter = link.textContent;
                    if (activeLetters.includes(letter)) {
                        link.classList.remove('disabled');
                        link.style.pointerEvents = 'auto';
                    } else {
                        link.classList.add('disabled');
                        link.style.pointerEvents = 'none';
                    }
                });
            }

            function filterData() {
                const searchTerm = searchInput.value.toLowerCase();

                const filtered = neighborhoodData.filter(item => {
                    const matchesSearch =
                        item.name.toLowerCase().includes(searchTerm) ||
                        (item.description && item.description.toLowerCase().includes(searchTerm)) ||
                        (item.locations && item.locations.some(loc => 
                        (loc.name && loc.name.toLowerCase().includes(searchTerm)) ||
                        (loc.description && loc.description.toLowerCase().includes(searchTerm)) ||
                        (loc.address && loc.address.toLowerCase().includes(searchTerm))
                    ));

                    const matchesRegion = activeRegion === 'all' || !activeRegion || item.region === activeRegion;

                    return matchesSearch && matchesRegion;
                });

                render(filtered);
                clearBtn.style.display = searchTerm ? 'flex' : 'none';
            }

            searchInput.addEventListener('input', filterData);

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                filterData();
                searchInput.focus();
            });

            /*
            filterContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-chip') || e.target.closest('.filter-chip')) {
                    const chip = e.target.classList.contains('filter-chip') ? e.target : e.target.closest('.filter-chip');
                    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    activeRegion = chip.dataset.region;
                    filterData();
                }
            });
            */

            // Back to Top
            const backToTopBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) backToTopBtn.classList.add('visible');
                else backToTopBtn.classList.remove('visible');
            });
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Handle Hash
            if (window.location.hash) {
                setTimeout(() => {
                    const el = document.querySelector(window.location.hash);
                    if (el) el.scrollIntoView();
                }, 100);
            }

            // Init
            render(neighborhoodData);
            setTimeout(() => {
                loading.classList.add('hidden');
                setTimeout(() => loading.remove(), 500);
            }, 500);
        });

        // Loader Animation
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin { to { transform: rotate(360deg); } }
        `;
        document.head.appendChild(styleSheet);
    </script>
    <!-- finished the edit! -->
</body>

</html>
