  name: Beverly Grove
  region: Central L.A.
  description: ''
  landmarks:
  - name: Original Farmers Market Market
    description: The Original Farmers Market (6333 W 3rd St) opened July 1934 on retired dairy land owned by A.F. Gilmore. Permanent stalls replaced farmers' trucks within months; today the site hosts over 100 vendors and is a Los Angeles Historic-Cultural Monument (HCM 543).
    type: landmark
    address: 6333 W 3rd St, LA, CA 90036
    link: https://www.google.com/maps/search/?api=1&query=6333+W+3rd+St,+LA,+CA+90036
  - name: The Grove
    description: Adjacent to the market, The Grove (189 The Grove Dr) emerged in the early 2000s as a 575,000 sq ft open-air retail and entertainment complex. Developer Rick Caruso opened it in 2002, introducing an electric streetcar link to the market and spurring additional tourism and dining traffic.
    type: landmark
    address: 189 The Grove Dr, LA, CA 90036
    link: https://www.google.com/maps/search/?api=1&query=189+The+Grove+Dr,+LA,+CA+90036
- id: beverly-hills
  name: Beverly Hills
  region: Westside
  description: ''
  landmarks:
  - name: America's Most Famous Zipcode 90210
    description: '**Beverly Hills Hotel Historic Hotel** including the Polo Lounge  The Beverly Hills Hotel (9641 W Sunset Blvd) opened May 12 1912, two years before the city''s incorporation, on land once part of Rancho Rodeo de las Aguas. Designed by Elmer Grey in Mission Revival style, it was nicknamed the "Pink Palace" in 1948. Its Polo Lounge was christened by owner Hernando Courtright in 1941 for his polo-playing friends'
    type: landmark
    address: 9641 W Sunset Blvd, Beverly Hills, CA 90210
    link: https://www.google.com/maps/search/?api=1&query=9641+W+Sunset+Blvd,+Beverly+Hills,+CA+90210
  - name: Celebrity Medical & Office Hub
    description: Located in the "Golden Triangle," this building is known for housing high-profile medical and talent offices.- **Classic Beverly Grove Apartments** This is a 1936 multi-unit apartment building located just outside the Beverly Hills city limits.- **Falcon's Lair** The legendary hillside estate of silent film idol Rudolph Valentino. Named after his unproduced film The Hooded Falcon, this Spanish colonial aerie is steeped in Hollywood tragedy, rumors of hauntings, and the eccentric legacy of heiress Doris Duke, who later walled herself inside. Haunted, Glamorous, Secluded, Tragic.
    type: landmark
    address: 1436 Bella Drive, Beverly Hills, CA 90210
    link: https://www.google.com/maps/search/?api=1&query=1436+Bella+Drive,+Beverly+Hills,+CA+90210
  - name: Franklin Canyon Park
    description: This is a public park and nature preserve, but it is most famous as a legendary filming location.- **Groucho Marx’s Final Home** This single-story Trousdale Estates home was the last residence of the legendary comedian Groucho Marx.- **Modern Luxury in the "Deep Canyon"** Located in the Beverly Post Office (BHPO) area, this address is a prominent example of high-end contemporary redevelopment in a neighborhood known for celebrity privacy.- **North Arnaz Drive Historic District**- **North Arnaz Drive Historic District** A rare, preserved pocket of "garden apartments" built in 1928. Unlike the walled-off estates nearby, this district showcases a human-scale, walkable vision of luxury, where fountains and courtyards replace gates. A time capsule of the city's sophisticated multi-family past.
    type: landmark
    address: 300 N Arnaz Dr, Beverly Hills, CA 90211
    link: https://www.google.com/maps/search/?api=1&query=300+N+Arnaz+Dr,+Beverly+Hills,+CA+90211
  - name: The Flats
    description: The Flats is the original, level residential section north of Santa Monica Boulevard. Launched October 21 1906 as "Between the City and the Sea," The Flats featured larger lots with Spanish, Traditional, and Ranch-Style homes. Modern revival and celebrity-owned estates continue this pattern of elite, architect-driven design. The original "garden city" vision of Beverly Hills. Here, the manicured lawns are wide, the streets are lined with massive palm and jacaranda trees, and the architecture shifts from Spanish Colonial to storybook Tudor. It’s the "approachable" face of extreme wealth—perfectly flat and eerily quiet.
    type: landmark
    address: 1000 N Roxbury Dr, Beverly Hills, CA 90210
    link: https://www.google.com/maps/search/?api=1&query=1000+N+Roxbury+Dr,+Beverly+Hills,+CA+90210
  - name: The Golden Triangle
    description: 'The commercial heart of the 90210. Bounded by Wilshire, Santa Monica, and Cañon, this wedge of real estate concentrates the world’s highest luxury brands into a walkable, open-air runway. It smells of expensive perfume and tourists hoping to spot a celebrity.- **The Samuel Goldwyn Estate  (owned by Taylor Swift)** A historic landmark built in 1934 for movie mogul Samuel Goldwyn.- **The Sol Wurtzel Estate** This is a historic property designed in 1932 by the legendary architect Wallace Neff (who created the "California style"). Importance: It was built for Sol M. Wurtzel, a powerful classic Hollywood producer (Fox Film Corporation). The home is famous for its distinctive semicircular design that follows the contour of the land overlooking the Bel-Air Country Club. It is often cited as one of Neff’s grandest Mediterranean-style villas.'
    type: landmark
    address: 10452 Bellagio Road, Beverly Hills, CA 90210
    link: https://www.google.com/maps/search/?api=1&query=10452+Bellagio+Road,+Beverly+Hills,+CA+90210
  - name: Trousdale Estates
    description: 'Trousdale Estates, annexed to Beverly Hills in 1954 by developer Paul Trousdale, transformed the former Doheny Ranch foothills into 532 lots for celebrity architects. A living museum of architecture by legends like Wallace Neff and Paul R. Williams. Strict view-protection and architectural covenants preserve this hillside enclave of Mid-Century Modern masterpieces. The mid-century modern "Acropolis" of Los Angeles. Carved out of the Doheny Ranch in the 1950s, this enclave enforced strict rules: single-story homes only, flat roofs, and zero obstruction of the view.'
    type: landmark
    address: ''
    link: ''
