- id: angeles-crest
  name: Angeles Crest
  region: Angeles National Forest
  description: ''
  landmarks:
  - name: Mount Wilson Observatory Celebrated observatory complex featuring powerful solar & nighttime telescopes. Established 1904 by Caltech under Theodore von Kármán and completed north-slope telescopes by 1917, the 100-inch Hooker Telescope was the world's largest and enabled Edwin Hubble's discovery of the expanding universe in 1923, cementing its role in modern astronomy.
    description: ''
    type: landmark
    address: 100 Mt Wilson Circle Road, Mt Wilson, CA 91023
    link: ''
  - name: Angeles Crest Highway
    description: A 66-mile ribbon of asphalt draped over the spine of the San Gabriel Mountains. It’s a "road to the clouds" offering panoramic views of the LA basin on one side and the desolate Mojave on the other. A driving experience that demands focus, offering high-altitude thrills just minutes from the city. Dramatic, Windy, Alpine, Panoramic.- **Mount Wilson Observatory** The birthplace of modern astrophysics, where Hubble discovered the expanding universe. Perched a mile above Pasadena, these gleaming white domes house the legendary 100-inch Hooker telescope. It’s a temple of science surrounded by pine trees, often floating above the marine layer like an island in the sky.
    type: landmark
    address: 100 Mt Wilson Circle Road, Mt Wilson, CA 91023
    link: https://www.google.com/maps/search/?api=1&query=100+Mt+Wilson+Circle+Road,+Mt+Wilson,+CA+91023
  - name: Sturtevant Camp
    description: A rustic time capsule from the "Great Hiking Era" of the 1920s. Accessible only by foot or pack mule, this collection of cabins in Big Santa Anita Canyon offers a rare glimpse into a time when Angelenos escaped the city not by car, but by trail. The smell of woodsmoke and damp earth is pervasive.
    type: landmark
    address: 1 Chantry Flat, Sierra Madre, CA 91024
    link: https://www.google.com/maps/search/?api=1&query=1+Chantry+Flat,+Sierra+Madre,+CA+91024
  - name: Switzer Falls Trail
    description: A classic canyon descent leading to a 50-foot waterfall. Following the Arroyo Seco stream, the trail passes the ruins of the Switzer-in-the-Sierras resort, a ghostly reminder of early tourism. It’s a journey through riparian woodland, filled with the sound of rushing water and the shade of oak and alder.
    type: landmark
    address: 701 Angeles Crest Hwy, Tujunga, CA 91042
    link: https://www.google.com/maps/search/?api=1&query=701+Angeles+Crest+Hwy,+Tujunga,+CA+91042
