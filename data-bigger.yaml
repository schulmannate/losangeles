  - name: Original In-N-Out Burger Museum Replica of the first In-N-Out store. In honor of the chain's 1948 founding in a tiny 100 ft² drive-thru in Baldwin Park, a faithful replica of the original stand opened in March 2014 near its former location, which was demolished to make way for Interstate 10. Celebrates Harry and Esther Snyder's invention of California's first drive-thru hamburger stand and the two-way speaker box that accelerated car-side service. Operates as both shrine and mini-museum, staffed by In-N-Out ambassadors who share company lore and display period props and décor
