    description: (Historic; Spanish for "White Bluff") the main camp of the Californio forces in the Mexican-American War- **2nd Street Residential Historic District**  Historically called Paredón Blanco ("White Bluff") under Spanish and Mexican rule, Boyle Heights became Pueblito in 1845 when displaced Tongva from Yaanga were relocated to springs near today's Beverly Blvd and Soto houses. The site was razed in 1847 under U.S. rule; no built-heritage survives beyond archaeological remains. Andrew Boyle bought 22 acres overlooking the river after the Mexican- **Boyle Avenue Residential Historic District**- **Brooklyn Heights (Historic)**- **Congregation Talmud Torah 'Breed Street Shul'**  the Breed St. Shul in Boyle Heights. From 1915 to 1951 it was the largest Jewish Orthodox synagogue in the western United States, and is listed in the National Register of Historic Places- El Mercado de Los Angeles ("El Mercadito")
