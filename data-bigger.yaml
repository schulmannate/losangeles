- id: gardena
  name: Gardena
  region: South Bay
  description: A diverse city with a rich Japanese-American history, known for its strawberry farming roots and legal card clubs.
  subAreas:
    - name: Tokyo Central & Main
      description: The flagship of the Japanese grocery empire. A destination for sushi, imported snacks, and Japanese cosmetics.
      address: 1740 Artesia Blvd, Gardena, CA 90248
    - name: Larry Flynt's Hustler Casino
      description: A luxury card room owned by the late publisher Larry Flynt. A landmark of LA's specific "card club" gambling laws.
      address: 1000 W Redondo Beach Blvd, Gardena, CA 90247
    - name: Gardena Bowl
      description: A classic bowling alley famous for its "Coffee Shop" which serves some of the best Hawaiian comfort food (loco moco) in the city.
      address: 15707 S Vermont Ave, Gardena, CA 90247

- id: garvanza
  name: Garvanza
  region: Northeast L.A.
  description: The "Arty" district of Highland Park. Historically an artist colony in the early 1900s, known for its Craftsman architecture and poppy fields.
  subAreas:
    - name: Judson Studios
      description: The oldest family-run stained glass studio in America (1897). They crafted the glass for the cryptic Frank Lloyd Wright houses and the Capitol Records building.
      address: 200 S Ave 66, Los Angeles, CA 90042
    - name: The Lummis Home (El Alisal)
      description: The rustic stone castle built by hand by eccentric librarian Charles Lummis.
      address: 200 E Ave 43, Los Angeles, CA 90031

- id: glassell-park
  name: Glassell Park
  region: Northeast L.A.
  description: A hilly neighborhood nestled between the LA River and Mount Washington, increasingly popular for its winding roads and views.
  subAreas:
    - name: The Glassellland Sign
      description: A tongue-in-cheek replica of the Hollywood Sign that reads "GLASSELLLAND," installed in a resident's backyard visible from the freeway.
    - name: Polka Polish Restaurant
      description: A community staple serving pierogis and stuffed cabbage since 1994, reflecting the area's older European roots.
      address: 4112 Verdugo Rd, Los Angeles, CA 90065

- id: glendale
  name: Glendale
  region: Verdugos
  description: The third-largest city in Los Angeles County. A major business hub and the cultural center of the Armenian-American community.
  subAreas:
    - name: Forest Lawn Memorial Park
      description: A massive, museum-like cemetery famous for its replica Michelangelo statues and celebrity graves (Walt Disney, Michael Jackson, Elizabeth Taylor).
      address: 1712 S Glendale Ave, Glendale, CA 91205
    - name: The Americana at Brand
      description: A massive outdoor shopping and residential complex designed by Rick Caruso. It features a dancing fountain and a golden statue "The Spirit of American Youth."
      address: 889 Americana Way, Glendale, CA 91210
    - name: Alex Theatre
      description: A stunning 1925 Egyptian Revival vaudeville palace. A registered historic landmark.
      address: 216 N Brand Blvd, Glendale, CA 91203
    - name: Grand Central Air Terminal
      description: LA's first major airport (1929). This Art Deco gem is where Amelia Earhart and Charles Lindbergh flew. Now owned by Disney.
      address: 1310 Air Way, Glendale, CA 91201
    - name: Glendale Galleria (Apple Store #001)
      description: The location of the very first Apple Store in the world, opened by Steve Jobs in 2001.
      address: 100 W Broadway, Glendale, CA 91210
    - name: Museum of Neon Art (MONA)
      description: The only museum in the world dedicated exclusively to art in electric media, preserving historic LA neon signs.
      address: 216 S Brand Blvd, Glendale, CA 91204

- id: glendora
  name: Glendora
  region: San Gabriel Valley
  description: Known as the "Pride of the Foothills," a wealthy suburb with a charming downtown and strong Route 66 heritage.
  subAreas:
    - name: The Donut Man
      description: A legendary 24-hour donut shop on Route 66 famous for its seasonal fresh strawberry donuts (stuffed with whole berries).
      address: 915 E Rte 66, Glendora, CA 91740
    - name: Rubel Castle
      description: A massive folk-art fortress built by Michael Rubel using river rocks, recycled bottles, and scrap metal.
      address: 844 N Live Oak Ave, Glendora, CA 91741

- id: gorman
  name: Gorman
  region: Northwestern LA County
  description: A windy truck stop town on the Grapevine (I-5), famous for its spring wildflower superblooms.
  subAreas:
    - name: Tejon Ranch
      description: The largest private landholding in California (270,000 acres), historically a cattle ranch and now a conservation/development battleground.

- id: gramercy-park
  name: Gramercy Park
  region: South L.A.
  description: A residential neighborhood in South Los Angeles, bordered by Manchester and Century Boulevards, featuring rows of post-war single-family homes.

- id: granada-hills
  name: Granada Hills
  region: San Fernando Valley
  description: A quiet, windy suburban community in the North Valley, famous for its mid-century modern architecture.
  subAreas:
    - name: White Oak Avenue (The "E.T." Street)
      description: This street, lined with massive Deodar Cedar trees, is the iconic location where the kids flew their bikes in *E.T. the Extra-Terrestrial*.
      address: White Oak Ave (between San Jose St & Chatsworth St)
    - name: Balboa Highlands Eichler Tract
      description: A designated Historic Preservation Overlay Zone (HPOZ) containing over 100 Joseph Eichler mid-century modern homes.

- id: green-meadows
  name: Green Meadows
  region: South L.A.
  description: A residential neighborhood in South LA known for the expansive Freeman Park and a strong community identity.

- id: green-valley
  name: Green Valley
  region: Northwestern LA County (Sierra Pelona)
  description: A quiet, unincorporated mountain community known for its distinct four-season climate and the historic Green Valley Market.

- id: griffith-park
  name: Griffith Park
  region: Central L.A.
  description: The "Central Park" of Los Angeles, but wilder. At 4,210 acres, it is one of the largest urban wilderness parks in North America.
  subAreas:
    - name: Griffith Observatory
      description: The Art Deco icon on the hill. Famous for *Rebel Without a Cause* and *La La Land*.
      address: 2800 E Observatory Rd, Los Angeles, CA 90027
    - name: The Hollywood Sign
      description: Originally reading "HOLLYWOODLAND" (1923), this is the global symbol of the entertainment industry.
      address: Mount Lee, Los Angeles, CA 90068
    - name: The Old Zoo
      description: The ruins of the original LA zoo (closed 1966). Visitors can picnic inside the old stone lion cages.
      address: 4730 Crystal Springs Dr, Los Angeles, CA 90027
    - name: The Greek Theatre
      description: An open-air amphitheater nestled in the canyon, known for its perfect acoustics.
      address: 2700 N Vermont Ave, Los Angeles, CA 90027
    - name: Bronson Caves (The Batcave)
      description: A man-made tunnel used as the entrance to the Batcave in the 1960s *Batman* TV series.
      address: 3200 Canyon Dr, Los Angeles, CA 90068
    - name: Walt Disney's Barn
      description: The actual barn from Walt Disney's backyard where he built his model trains, moved here as a museum.
      address: 5202 Zoo Dr, Los Angeles, CA 90027
