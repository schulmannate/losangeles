- id: hacienda-heights
  name: Hacienda Heights
  region: San Gabriel Valley
  description: A large unincorporated community on the slopes of the Puente Hills, known for its panoramic views and significant Asian-American population.
  subAreas:
    - name: Hsi Lai Temple
      description:  One of the largest Buddhist temples in the Western Hemisphere (1988). Its Ming Dynasty-style architecture is a stunning landmark visible for miles.
      address: 3456 Glenmark Dr, Hacienda Heights, CA 91745
    - name: Puente Hills Landfill (Habitat Authority)
      description: Formerly the country's largest landfill, now being converted into a massive public park.
- id: hacienda-village
  name: Hacienda Village
  region: South L.A. (Watts)
  description: A historic public housing development designed by renowned architects Richard Neutra and Paul Williams in 1942.
- id: hancock-park
  name: Hancock Park
  region: Central L.A.
  description: An affluent, historic neighborhood famous for its palatial 1920s mansions, deep setback lawns, and ban on front fences.
  subAreas:
    - name: Getty House
      description: The official residence of the Mayor of Los Angeles. A Tudor Revival estate donated by the Getty oil family.
      address: 605 S Irving Blvd, Los Angeles, CA 90005
    - name: La Brea Tar Pits
      description:  The world's most famous Ice Age fossil excavation site, bubbling with natural asphalt right in the middle of the city.
      address: 5801 Wilshire Blvd, Los Angeles, CA 90036
    - name: Los Angeles County Museum of Art (LACMA)
      description: The largest art museum in the western United States, known for the "Urban Light" lamp post installation.
      address: 5905 Wilshire Blvd, Los Angeles, CA 90036
    - name: El Coyote Cafe
      description: A kitschy Mexican restaurant opened in 1931. Famous for its margaritas and being the location of Sharon Tate's last meal.
      address: 7312 Beverly Blvd, Los Angeles, CA 90036
- id: harbor-city
  name: Harbor City
  region: Harbor
  description: A diverse neighborhood connecting the South Bay to the Port of LA, known for the massive Ken Malloy Harbor Regional Park.
  subAreas:
    - name: Ken Malloy Harbor Regional Park
      description: Home to Machado Lake and a major wetland habitat. Famous for "Reggie the Alligator," an abandoned pet who lived in the lake for years.
      address: 25820 Vermont Ave, Harbor City, CA 90710
- id: harbor-gateway
  name: Harbor Gateway
  region: Harbor
  description: A bizarrely shaped "shoestring" strip of land annexed by Los Angeles in 1906 to connect the city to the port.
- id: harvard-heights
  name: Harvard Heights
  region: Central L.A.
  description: A dense historic district known for its "gentleman’s farms" and the only remaining Greene & Greene house in the city proper.
  subAreas:
    - name: The Ray Charles Memorial Library
      description: The studio and office where Ray Charles recorded his hits. It is now a historic landmark and museum.
      address: 2107 W Washington Blvd, Los Angeles, CA 90018
- id: hawaiian-gardens
  name: Hawaiian Gardens
  region: Gateway Cities
  description: The smallest city in LA County (0.9 sq miles). It began as a Depression-era refreshment stand with a palm leaf roof and grew into a casino town.
  subAreas:
    - name: The Gardens Casino
      description: A massive card club that generates a significant portion of the city's revenue.
      address: 11871 Carson St, Hawaiian Gardens, CA 90716
- id: hawthorne
  name: Hawthorne
  region: South Bay
  description: The "City of Good Neighbors," historic home of the Beach Boys, and current headquarters of SpaceX.
  subAreas:
    - name: SpaceX Headquarters
      description:  Elon Musk's rocket factory. You can often see the first stage of a Falcon 9 rocket displayed outside.
      address: 1 Rocket Rd, Hawthorne, CA 90250
    - name: Beach Boys Historic Landmark
      description: The site of the Wilson brothers' childhood home, where they wrote their early surfing hits. The house was demolished for the 105 freeway, but a monument remains.
      address: 3701 W 119th St, Hawthorne, CA 90250
    - name: Chips Restaurant
      description: A classic 1950s Googie-style diner designed by Harry Lemon.
      address: 11908 Hawthorne Blvd, Hawthorne, CA 90250
- id: hermosa-beach
  name: Hermosa Beach
  region: South Bay
  description: A lively beach city famous for its surf culture, punk rock history, and the nightlife scene on Pier Avenue.
  subAreas:
    - name: The Lighthouse Cafe
      description: A legendary jazz club (1949) that hosted Miles Davis and Chet Baker. Featured prominently in *La La Land*.
      address: 30 Pier Ave, Hermosa Beach, CA 90254
    - name: Hermosa Beach Pier
      description: A concrete pier offering sweeping views of the Santa Monica Bay, popular for fishing and sunset walks.
    - name: The Strand
      description: The paved path running along the sand, serving as the "main street" for cyclists and joggers.
- id: highland-park
  name: Highland Park
  region: Northeast L.A.
  description: One of LA's oldest neighborhoods, now the epicenter of the city's hipster culture while retaining its deep Latino roots.
  subAreas:
    - name: Galco's Soda Pop Stop
      description: A world-famous grocery store dedicated to vintage and obscure sodas.
      address: 5702 York Blvd, Los Angeles, CA 90042
    - name: Highland Park Bowl
      description: LA's oldest bowling alley (1927), beautifully restored to its Prohibition-era glory.
      address: 5621 N Figueroa St, Los Angeles, CA 90042
    - name: Chicken Boy
      description: A 22-foot fiberglass statue of a boy with a chicken head holding a bucket of chicken. A Route 66 icon saved and relocated here.
      address: 5558 N Figueroa St, Los Angeles, CA 90042
    - name: Avenue 50 Studio
      description: A key arts organization promoting Chicano and Latino culture in the neighborhood.
      address: 131 N Ave 50, Los Angeles, CA 90042
- id: historic-filipinotown
  name: Historic Filipinotown
  region: Central L.A.
  description: A designated district honoring the Filipino-American heritage of the area, located just west of downtown.
  subAreas:
    - name: The Gintong Kasaysayan Mosaic
      description: A massive mural in Unidad Park depicting the history of Filipino Americans.
      address: 1644 Beverly Blvd, Los Angeles, CA 90026
    - name: The Original Tommy's
      description: The first location (1946) of the legendary chili burger chain. Open 24 hours.
      address: 2575 W Beverly Blvd, Los Angeles, CA 90057
- id: hollywood
  name: Hollywood
  region: Central L.A.
  description: The global capital of the entertainment industry, blending gritty history with red carpet glamour.
  subAreas:
    - name: Grauman's Chinese Theatre
      description:  The world's most famous movie palace (1927), known for the cement handprints of stars in the forecourt.
      address: 6925 Hollywood Blvd, Los Angeles, CA 90028
    - name: Hollywood Walk of Fame
      description: The 15-block sidewalk tribute to over 2,700 entertainers.
    - name: Hollywood Bowl
      description:  The world's largest natural amphitheater. Its concentric arched shell is an Art Deco icon.
      address: 2301 N Highland Ave, Los Angeles, CA 90068
    - name: Capitol Records Building
      description: The world's first circular office building (1956), designed to look like a stack of records.
      address: 1750 N Vine St, Los Angeles, CA 90028
    - name: Musso & Frank Grill
      description: Hollywood's oldest restaurant (1919). A haunt for writers like Faulkner and Hemingway.
      address: 6667 Hollywood Blvd, Los Angeles, CA 90028
    - name: Hollywood Forever Cemetery
      description:  The final resting place of Rudolph Valentino and Judy Garland. Also a venue for outdoor movie screenings.
      address: 6000 Santa Monica Blvd, Los Angeles, CA 90038
    - name: Amoeba Music
      description: One of the world's largest independent record stores.
      address: 6200 Hollywood Blvd, Los Angeles, CA 90028
    - name: Runyon Canyon Park
      description: The hiking trail to see and be seen. Famous for celebrity sightings and sweeping city views.
      address: 2000 N Fuller Ave, Los Angeles, CA 90046
    - name: Magic Castle
      description: The exclusive private clubhouse for the Academy of Magical Arts. A Victorian mansion filled with secret passages.
      address: 7001 Franklin Ave, Los Angeles, CA 90028
- id: hollywood-hills
  name: Hollywood Hills
  region: Santa Monica Mountains
  description: The hillside neighborhoods overlooking the city, characterized by winding roads, stilt houses, and celebrity estates.
  subAreas:
    - name: Mulholland Drive
      description: The world's most famous scenic drive, offering panoramic views of both the city and the valley.
    - name: Stahl House (Case Study #22)
      description:  Pierre Koenig's glass-walled modernist icon (1960) perched on a cliff.
      address: 1635 Woods Dr, Los Angeles, CA 90069
    - name: Chemosphere
      description: John Lautner's "flying saucer" house (1960) perched on a single concrete column.
      address: 3105 Torreyson Pl, Los Angeles, CA 90046
    - name: Laurel Canyon
      description: The epicenter of the 1960s folk-rock counterculture (Joni Mitchell, The Doors, Crosby Stills & Nash).
- id: holmby-hills
  name: Holmby Hills
  region: Westside
  description: One third of the "Platinum Triangle" (with Bel Air and Beverly Hills). Known for massive estates like the Playboy Mansion and The Manor.
