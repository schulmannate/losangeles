    address: 301 N Baldwin Ave, Arcadia, CA 91007
    link: ''
  - name: Santa Anita Park Racetrack Opened in December 1934 under the leadership of Charles H. "Doc" Strub, this Art Deco racetrack pioneered the photo finish and $100,000 Santa Anita Handicap. Designed by Gordon B. Kaufmann, it became "The World's Richest Racetrack" and served as a WWII Japanese-American internment center in 1942, later hosting the 1984 Olympic equestrian events. Before being sent to permanent camps (like Manzanar), Japanese Americans were held in "Assembly Centers." Santa Anita was the largest of these. From March to October 1942, approximately 19,000 Japanese Americans lived at the racetrack. Many were forced to live in horse stalls that still smelled of manure.
    description: ''
    type: landmark
    address: 285 W Huntington Dr, Arcadia, CA 91007
    link: ''
