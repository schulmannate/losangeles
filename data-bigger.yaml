    description: The community of Saugus was initially named Newhall by Henry Mayo Newhall. In 1879, after shifting the town's borders a few miles south, he renamed it Saugus after his birthplace in Saugus, Massachusetts. Many of the early residents migrated from Texas and Oklahoma to work in the oil fields. But the rural landscape also attracted those seeking space away from the city. Home to the Original Saugus Café, established in 1886— the oldest continuously operating restaurant in LA County
