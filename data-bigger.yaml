- id: east-hollywood
  name: East Hollywood
  region: Central L.A.
  description: A dense, diverse community home to Thai Town, Little Armenia, and major medical centers.
  subAreas:
    - name: Thai Town
      description: The world's first designated Thai Town (1999). Home to late-night boat noodles, Elvis impersonators at Palms Thai, and the annual Songkran festival.
      address: Hollywood Blvd between Western & Normandie
    - name: Little Armenia
      description: A cultural enclave established by Armenian immigrants in the 1970s. Key landmarks include the St. Garabed Armenian Apostolic Church.
    - name: Barnsdall Art Park (Hollyhock House)
      description: A hilltop park featuring Frank Lloyd Wright's first LA project (UNESCO World Heritage Site).
      address: 4800 Hollywood Blvd, Los Angeles, CA 90027
    - name: Zankou Chicken (Original)
      description: The location that launched the legendary garlic paste (toum) empire in Los Angeles.
      address: 5065 Sunset Blvd, Los Angeles, CA 90027
- id: east-los-angeles
  name: East Los Angeles
  region: Eastside
  description: The largest unincorporated community in California and the historic heart of the Mexican-American civil rights movement.
  subAreas:
    - name: Whittier Boulevard Arch
      description: The iconic "East Los Angeles" arch spanning the boulevard, marking the route famous for lowrider cruising culture.
      address: Whittier Blvd & Goodrich Blvd, East Los Angeles, CA 90022
    - name: El Mercado de Los Angeles
      description: A three-story indoor market (built 1968) offering mariachi dining, exotic spices, and handcrafted goods.
      address: 3425 E 1st St, Los Angeles, CA 90063
    - name: Maravilla Handball Court
      description: The oldest handball court in Los Angeles (built 1928), a centerpiece of the Maravilla neighborhood's sporting history.
      address: 501 N Mednik Ave, East Los Angeles, CA 90022
    - name: Golden Gate Theater
      description: A 1927 Spanish Churrigueresque movie palace (now a CVS, but the shell remains) that was a major site in the Chicano Movement.
      address: 5176 Whittier Blvd, East Los Angeles, CA 90022
    - name: Home of "Stand and Deliver"
      description: Garfield High School, made famous by teacher Jaime Escalante and the film *Stand and Deliver*.
      address: 5101 E 6th St, Los Angeles, CA 90022
