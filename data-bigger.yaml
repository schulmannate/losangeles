  description: ''
  landmarks:
  - name: Catalina Casino The Catalina Casino (not a gambling casino, but a grand ballroom and theater) is arguably the island's most iconic building, a testament to Jazz Age ambition. Dedicated May 29, 1929, William Wrigley Jr.'s Art Deco–Mediterranean Casino was built by Walter Webber and Sumner Spaulding for $2 million as Avalon's social and civic hub. Its round 1,154-seat Avalon Theatre (first designed for sound in 1929) and 20,000 sq ft ballroom have hosted Big Band dances, steel-vessel film premieres, and the 1984 Olympic equestrian events. The Casino remains Avalon's most iconic landmark and a California Historical Landmark since 1971.
