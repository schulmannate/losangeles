  - name: Los Angeles County Arboretum & Botanic Garden 127-acre educational garden on historic Rancho Santa Anita grounds; Housed on the 1875 Rancho Santa Anita estate of Elias J. "Lucky" Baldwin and founded as a public garden in 1955; features Queen Anne Cottage and Lake Arroyo
    description: ''
