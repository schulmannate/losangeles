    description: 127-acre educational garden on historic Rancho Santa Anita grounds; Housed on the 1875 Rancho Santa Anita estate of Elias J. "Lucky" Baldwin and founded as a public garden in 1955; features Queen Anne Cottage and Lake Arroyo. Best known as the intro to Fantasy Island ("Da plane! Da plane!"), the 1885 Victorian Queen Anne Cottage is a wedding cake of a building sitting on the edge of Baldwin Lake. It is ornate, preserved behind glass, and famously spooky—rumors of the Lucky Baldwin family ghosts haunting the halls are local lore.
    type: landmark
    address: 301 N Baldwin Ave, Arcadia, CA 91007
