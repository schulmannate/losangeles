  name: Beverly Crest
  region: Westside
  description: ''
  landmarks:
  - name: Sheats-Goldstein Residence
    description: ''
    type: sub-neighborhood
    address: ''
    link: ''
  - name: 'Further exploring the cinematic use of dramatic modernism is the Sheats-Goldstein Residence in Beverly Crest. Designed in 1961 by John Lautner, an apprentice of Frank Lloyd Wright, the glass and concrete house clings to the side of a canyon and is characterized by its plunging concrete angles and organic integration with the surrounding nature. Its most recognizable cinematic role is as the estate of pornographer Jackie Treehorn in the Coen Brothers'' 1998 film The Big Lebowski. The brutalist, cavernous living spaces perfectly encapsulated the intimidating, opulent, and slightly predatory nature of the character, reinforcing Lautner''s unofficial status as Hollywood''s preferred architect for sophisticated antagonists. The house, which was donated to the Los Angeles County Museum of Art (LACMA) in 2016, has also appeared in Charlie''s Angels: Full Throttle and numerous music videos, cementing its status as a highly sought-after location for conveying excessive, stylistic wealth.'
    description: ''
    type: sub-neighborhood
    address: ''
    link: ''
