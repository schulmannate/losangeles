- id: acton
  name: Acton
  region: Antelope Valley - Unincorporated
  description: ''
  landmarks:
  - name: Rio Groceries
    description: A genuine operating rural country store, just off paved 2 lane highway, Soledad Canyon Road, Rio Groceries is more than a market—it’s a cinematic relic wrapped in rural charm.
    type: landmark
    address: 9411 Soledad Canyon Road Acton, CA 91390
    link: ''
  - name: The Shambala Preserve
    description: The Shambala Preserve is a 40-acre animal sanctuary established in 1972. Maintained by the Roar Foundation, founded by actress Tippi Hedren in 1983 to rescue and provide lifelong care for exotic wildlife, especially big cats. Shambala Preserve rose to prominence when Michael Jackson’s two Bengal tigers, ‘Sabu’ and ‘Thriller,’ were relocated there in 2006.
    type: landmark
    address: 6867 Soledad Canyon Rd, Acton, CA 93510
    link: https://www.google.com/maps/search/?api=1&query=6867+Soledad+Canyon+Rd,+Acton,+CA+93510
  - name: The 49er Saloon
    description: A rowdy slice of the Old West where Harleys replace horses. Claiming to be one of the oldest standing saloons in California (est. 1870s), it smells of stale beer, exhaust fumes, and grilled tri-tip. A genuine biker outpost that hasn't polished away its rough edges.
    type: landmark
    address: 31908 Crown Valley Rd, Acton, CA 93510
    link: https://www.google.com/maps/search/?api=1&query=31908+Crown+Valley+Rd,+Acton,+CA+93510
  - name: Polsa Rosa Ranch
    description: A "rental reality" hidden in the dust. This active movie ranch features a standing ghost town set used in Westworld and Agents of S.H.I.E.L.D.. Unlike polished studio tours, it feels like a forgotten settlement left to rot in the sun, blurring the line between prop and ruin.
    type: landmark
    address: 5726 Soledad Canyon Rd, Acton, CA 93510
    link: https://www.google.com/maps/search/?api=1&query=5726+Soledad+Canyon+Rd,+Acton,+CA+93510
  - name: Mt. Gleason Nike Missile Site (LA-04)
    description: A concrete scar from the Atomic Age. Once the highest-altitude nuclear missile defense site in the U.S., it now sits abandoned in the Angeles National Forest. Exploring the rusting launch pads and graffiti-covered barracks offers a chilling, silent reminder of Cold War paranoia.
    type: landmark
    address: Forest Route 3N17, Acton, CA 93510
    link: https://www.google.com/maps/search/?api=1&query=Forest+Route+3N17,+Acton,+CA+93510
- id: adams-normandie
  name: Adams-Normandie
  region: South L.A.
  description: In 1940, the Black population of Los Angeles was approximately 63,744. By 1950, largely due to the Great Migration and defense jobs, it rose to 171,209. As white flight occurred in the 1950s, the West Adams/Normandie area became predominantly African American. In the 2000s, this shifted again; the 2010 Census showed the Adams-Normandie neighborhood was 68.2% Latino and 22.5% African American.
  landmarks:
  - name: First African Methodist Episcopal Zion<br>Cathedral & Community Center
    description: 'Historic Cultural Monument #341 and a spiritual anchor for the community. This church stands as a testament to the neighborhood''s shifting demographics and enduring faith, serving as a cornerstone of local African American history and cultural resilience.'
    type: landmark
    address: 1449 W Adams Blvd, Los Angeles, CA 90007
    link: https://www.google.com/maps/search/?api=1&query=1449+W+Adams+Blvd,+Los+Angeles,+CA+90007
  - name: Sugar Hill Historic District
    description: The "Black Beverly Hills" of the mid-century, where icons like Hattie McDaniel and Louise Beavers broke the color line of restrictive covenants. A neighborhood of grand architecture and even grander social significance, representing the pinnacle of the African American elite in classic Hollywood.
    type: landmark
    address: 2201 S Harvard Blvd, Los Angeles, CA 90018
    link: https://www.google.com/maps/search/?api=1&query=2201+S+Harvard+Blvd,++Los+Angeles,+CA+90018
  - name: Hattie McDaniel Residence
    description: The former home of the legendary Hattie McDaniel, the first African American to win an Oscar. This residence is a silent monument to Hollywood triumph and segregation-era struggle, sitting quietly within the prestigious Sugar Hill district she helped integrate.
    type: landmark
    address: 2203 S Harvard Blvd Los Angeles, CA 90018
    link: https://www.google.com/maps/search/?api=1&query=2203+S+Harvard+Blvd+Los+Angeles,+CA+90018
  - name: 'Bernays House<br>Historic-Cultural Monument #780'
    description: 'Designated Historic-Cultural Monument #780, this residence anchors the street with significant architectural weight. A tangible slice of local heritage that demands a sidewalk pause to appreciate the specific craftsmanship of a bygone era in Los Angeles housing.'
    type: landmark
    address: 1656 W 25th StLos Angeles, CA 90007
    link: https://www.google.com/maps/search/?api=1&query=1656+W+25th+StLos+Angeles,+CA+90007
  - name: Loren Miller Recreation Center
    description: A community hub named for the civil rights attorney and judge who fought housing discrimination. Loren Miller appeared before the U.S. Supreme Court in Shelley v. Kraemer (1948), which struck down the enforcement of racial covenants nationwide. While it functions as a standard active park, its name carries the weighty legacy of the legal battles that integrated this very neighborhood.
    type: landmark
    address: 2717 S Halldale Ave, Los Angeles, CA 90018
    link: https://www.google.com/maps/search/?api=1&query=2717+S+Halldale+Ave,+Los+Angeles,+CA+90018
  - name: Adams Normandie Historic Preservation Overlay Zone
    description: A sprawling architectural time capsule where Craftsman bungalows rub shoulders with stately Queen Anne Victorians. This preservation zone captures the shifting tides of early 20th-century Los Angeles development, offering a walkable lesson in the city's residential evolution.
    type: landmark
    address: ''
    link: ''
  - name: Vacant Fire Engine House No. 18
    description: A vacant, ghost-like shell of civic duty. This Mission Revival structure, designed by Morgan & Walls, sits silent and shuttered, waiting for a second life while offering a glimpse into the early infrastructure of a rapidly expanding Los Angeles
    type: landmark
    address: 2616 S Hobart Blvd, Los Angeles, CA 90018
    link: https://www.google.com/maps/search/?api=1&query=2616+S+Hobart+Blvd,+Los+Angeles,+CA+90018
- id: agoura-hills
  name: Agoura / Agoura Hills
  region: Santa Monica Mountains
  description: A gateway to the Santa Monica Mountains. The area was originally inhabited by the Chumash people, who lived in the region for thousands of years before Spanish colonization. The land was later part of Rancho Las Virgenes, a Mexican land grant. In the 1920s, the area became a popular filming location for Western movies, leading to the establishment of Paramount Ranch. The city of Agoura Hills was incorporated in 1982, and it has since developed into a suburban community while still retaining its connection to the natural beauty of the surrounding mountains.
  landmarks:
  - name: Paramount Ranch Historic film set and parkland used since 1927 for dozens of Western movies and TV series, now part of the Santa Monica Mountains NRA.
    description: ''
    type: landmark
    address: 32903 Cornell Road, Agoura Hills, CA, 91301
    link: 'https://www.google.com/maps/search/?api=1&query=32903+Cornell+Road,+Agoura+Hills,+CA,+91301'
  - name: Reyes Adobe Museum Agoura Hills' first home represents 150 years of exciting California history. 19th-century rancho headquarters preserved as a local history museum in the city's center, on Old Ranch Rd.
    description: ''
    type: landmark
    address: 30400 Rainbow Crest Dr, Agoura Hills, CA 91301
    link: ''
  - name: Old Place
    description: 'The Old Place, is reminiscent of another time. It''s no wonder, since the rustic wood building served as a post office and general store from 1908 to 1940; although it was transformed into a restaurant in 1970, it still retains an Old Western feel with its dark-wood booths, original wood bar, and dim chandeliers.'
    type: landmark
    address: 29983 Mulholland Hwy., Cornell, CA 91301
    link: https://www.google.com/maps/search/?api=1&query=29983+Mulholland+Hwy.,+Cornell,+CA+91301
  - name: Reyes Adobe Museum 
    description: 'Agoura Hills' first home represents 150 years of exciting California history. 19th-century rancho headquarters preserved as a local history museum in the city's center, on Old Ranch Rd.'
    type: landmark
    address: 30400 Rainbow Crest Dr, Agoura Hills, CA 91301
    link: https://www.google.com/maps/search/?api=1&query=30400+Rainbow+Crest+Dr,+Agoura+Hills,+CA+91301
  - name: Mel Gibson's $37 million church <br>in the Malibu Hills <br> Church of the Holy Family 
    description: 'A private chapel built by Mel Gibson in 2002, designed to resemble a medieval European church. It features stained glass windows, a bell tower, and intricate stonework, serving as a secluded sanctuary for the actor and his family.'
    type: landmark
    address: 30188 Mulholland Hwy Agoura Hills, CA 91301
    link: https://www.google.com/maps/search/?api=1&query=30188+Mulholland+Hwy+Agoura+Hills,+CA+91301
  - name: The Rock Store
    description: The "Sunday Mass" for Southern California's motorcycle culture. Nestled in the twisties of Mulholland, this stone-walled former stagecoach stop erupts every weekend into a chrome-plated spectacle. It’s the only place where outlaw bikers and A-list celebrities share picnic tables over tri-tip sandwiches and engine noise.
    type: landmark
    address: 30354 Mulholland Hwy Agoura Hills, CA 91301
    link: https://www.google.com/maps/search/?api=1&query=30354+Mulholland+Hwy+Agoura+Hills,+CA+91301
- id: agua-dulce
  name: Agua Dulce
  region: Santa Clarita Valley
  description: ''
  landmarks:
  - name: Halfway House Café
    description: A lonely roadside beacon that has served as the cinematic backdrop for everything from Heroes to Waitress. Since 1931, this diner has stood frozen in time, serving simple comfort food surrounded by the dusty, high-desert silence that filmmakers crave.
    type: landmark
    address: 15564 Sierra Hwy, Santa Clarita, CA 91390
    link: https://www.google.com/maps/search/?api=1&query=15564+Sierra+Hwy,+Santa+Clarita,+CA+91390
  - name: Vasquez Rocks Natural Area Park
    description: Striking rock formations popular for hiking and filming, managed by Los Angeles County Parks. The park commemorates outlaw Tiburcio Vasquez who used the rocks as a hideout in 1874, and is listed on the National Register for its geological and cultural significance. The quintessential "alien planet" of Hollywood. These violent, uplifted sandstone slabs jut from the earth at impossible 50-degree angles, creating a prehistoric playground that feels instantly recognizable from Star Trek and The Flintstones. A geologic hallucination.
    type: landmark
    address: 10700 Escondido Canyon Rd, Agua Dulce, CA 91390
    link: https://www.google.com/maps/search/?api=1&query=10700+Escondido+Canyon+Rd,+Agua+Dulce,+CA+91390
- id: alhambra
  name: Alhambra
  region: San Gabriel Valley
  description: Alhambra reflects the "Ethnoburb" phenomenon of the San Gabriel Valley. Unlike traditional Chinatowns (urban centers), this was a suburban migration. Alhambra's population is approximately 51% Asian, distinguishing it as one of the major hubs of the Chinese diaspora in Southern California.
  landmarks:
  - name: Emery Park
    description: ''
    type: sub-neighborhood
    address: ''
    link: ''
  - name: Stoneman
    description: ''
    type: sub-neighborhood
    address: ''
    link: ''
  - name: Downtown Alhambra
    description: Generally defined as the commercial corridor along Main Street between Atlantic and Garfield.- **The Hat** Fast-food restaurant specializing in pastrami sandwiches. A pilgrimage site for pastrami purists, famous not just for the flavor but for the sheer, gravitational weight of the sandwiches. This is fast food "Alhambra style"—greasy, chaotic, and served in portions that defy medical advice. The neon sign is a beacon of late-night indulgence. -
    type: landmark
    address: 1 West Valley Boulevard, Alhambra, CA 91801
    link: https://www.google.com/maps/search/?api=1&query=1+West+Valley+Boulevard,+Alhambra,+CA+91801
  - name: Diner on Main
    description: Designed by the legendary firm Armet & Davis, this is Googie architecture at its most optimistic. With its dramatic roofline and stone accents, it feels like a set piece from the 1950s utopia, and a preserved specimen of Southern California's "Coffee Shop Modern" era. -
    type: landmark
    address: 201 W Main St, Alhambra, CA 91801
    link: https://www.google.com/maps/search/?api=1&query=201+W+Main+St,+Alhambra,+CA+91801
  - name: Kim Chuy Restaurant
    description: A rare survivor of "Programmatic Architecture," this building is literally shaped like a giant chili bowl. It’s a visual pun from an era when buildings had to scream at passing cars to get attention. -
    type: landmark
    address: 501 W Valley Blvd, Alhambra, CA 91803
    link: https://www.google.com/maps/search/?api=1&query=501+W+Valley+Blvd,+Alhambra,+CA+91803
  - name: Goody's Coffee Shop (Former)
    description: The ghost of a Googie masterpiece. Once a thriving coffee shop with a jagged, space-age roofline, it now stands repurposed. A drive-by essential for architecture hunters looking for "fossilized" design. -
    type: landmark
    address: 865 E. Las Tunas Drive, San Gabriel, CA 91776
    link: https://www.google.com/maps/search/?api=1&query=865+E.+Las+Tunas+Drive,+San+Gabriel,+CA+91776
  - name: Bun and Burger
    description: A 1941 time capsule that feels less like a restaurant and more like a film set (it was used in The Little Things). The neon sign features a harried waiter who has been rushing that burger for 80 years. Cash only, vinyl booths, and an atmosphere thick with noir potential.-
    type: landmark
    address: 1000 East Main Street, Alhambra, CA 91801
    link: https://www.google.com/maps/search/?api=1&query=1000+East+Main+Street,+Alhambra,+CA+91801
  - name: Twohey's (Former)
    description: The spiritual home of the "Little Stink-O" clothespin-nosed mascot. While the restaurant has moved to South Pasadena, this corner remains the hallowed ground where the legendary sundaes and onion rings were served since 1943. A site of deep local nostalgia, even if the original building is gone. -
    type: landmark
    address: 1224 N. Atlantic Blvd, Alhambra, CA 91801
    link: https://www.google.com/maps/search/?api=1&query=1224+N.+Atlantic+Blvd,+Alhambra,+CA+91801
  - name: Hi Ya Ya
    description: A strip-mall oddity immortalized by photographers like M. Kasahara. It represents the chaotic, delightful visual clutter of the San Gabriel Valley, where generic architecture is punctuated by hyper-specific, sometimes baffling, signage and storefronts.
    type: landmark
    address: 1288 South Garfield Avenue, Alhambra, CA 91801
    link: https://www.google.com/maps/search/?api=1&query=1288+South+Garfield+Avenue,+Alhambra,+CA+91801
  - name: Phil Spector's Castle
    description: The Pyrenees Castle. A hilltop mansion that looms over the city with a dark, Hollywood-noir energy. Once the home of music producer Phil Spector and the site of the Lana Clarkson tragedy, it is a place of walled-off secrets and Gothic atmosphere in the middle of suburbia.
    type: landmark
    address: 1700 South Grandview Drive, Alhambra, CA 91803
    link: https://www.google.com/maps/search/?api=1&query=1700+South+Grandview+Drive,+Alhambra,+CA+91803
  - name: The Lanai Motel
    description: A roadside relic of the motor court era. The neon sign is the star here—a glowing, tropical promise of leisure that contrasts with the busy Valley Boulevard traffic. It captures the mid-century "tiki" obsession that once swept through American motel design.
    type: landmark
    address: 1745 West Valley Blvd, Alhambra, CA 91803
    link: https://www.google.com/maps/search/?api=1&query=1745+West+Valley+Blvd,+Alhambra,+CA+91803
  - name: Fosselman’s Ice Cream Company
    description: An institution since 1919. This isn't artisanal gelato; it's hard-scoop Americana with a distinct Alhambra twist (taro and corn flavors sit next to vanilla). The tiny shop feels like stepping into a simpler decade, smelling of sugar cones and freezing cream.
    type: landmark
    address: 1824 W Main St, Alhambra, CA 91801
    link: https://www.google.com/maps/search/?api=1&query=1824+W+Main+St,+Alhambra,+CA+91801
  - name: Aloha Food Factory
    description: A cinderblock shack that transports you straight to the North Shore. No frills, just massive plates of macadamia nut pancakes and loco moco served in a space that feels like a beachside dive. A beloved local holdout against sleek development.-
    type: landmark
    address: 2990 W Valley Blvd, Alhambra, CA 91803
    link: https://www.google.com/maps/search/?api=1&query=2990+W+Valley+Blvd,+Alhambra,+CA+91803
